# Decoding config for field-type: estimation_enum (Scope B, 2026-09-04).
#
# Temperature 0 + structured (JSON-schema-constrained) decoding, per D10/D33.
# k=1 is the primary sampling protocol (D10); the k=3 / 2-of-3 ladder is
# pre-registered but NOT built (trigger = gold STATED coverage < 80%).
# Mirrors the sort enum discipline.
field_type: estimation_enum
temperature: 0
top_p: 1
structured: true
schema: schemas/estimation_enum.schema.json
k: 1
max_output_tokens: 2048  # ceiling: room for the value + its verbatim quote; a truncated reply parses to None, never a silent UNKNOWN
