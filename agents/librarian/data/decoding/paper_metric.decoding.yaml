# Decoding config for field-type: paper_metric (build brief §5.3, D10/D33).
#
# Temperature 0 + structured (JSON-schema-constrained) decoding, per D10/D33.
# k=1 is the primary sampling protocol (D10); the k=3 / 2-of-3 ladder is
# pre-registered but NOT built (trigger = gold STATED coverage < 80%).
#
# v1.1: paper_facts claimed_headline_metric. A COMPOSITE value ({mean, t_stat,
# unit}), so the D9 merge normalises it via normalise(..., value_kind=
# "paper_metric") -- a canonical sorted-key tuple, so two models that emit the
# same figure in a different key order still agree.
field_type: paper_metric
temperature: 0
top_p: 1
structured: true
schema: schemas/paper_metric.schema.json
k: 1
max_output_tokens: 512
