# --- field -> field-type (Part 1 + ALREADY_FINAL_PART2 + v1.1 paper_facts) ---
  # --- Scope B (2026-09-04): fitted-model estimation field-types. FORKED files
  # per the isolation principle (edits here never re-stamp a sort-field sha);
  # the resulting prompt-string stratification is the registered never-pooled
  # KPP reporting shape. Menus render from ESTIMATION_MENUS; definitions/ranges
  # from the separate estimation_definitions.yaml.
  estimation_enum:
    prompt: prompts/estimation_enum.prompt.txt
    schema: schemas/estimation_enum.schema.json
    decoding: decoding/estimation_enum.decoding.yaml
    sha256: 6e0ff284fe25bd551f6feec459e2d4db893c6c6e48ded0fbb6bb61620ff649d1
  int_set:
    prompt: prompts/int_set.prompt.txt
    schema: schemas/int_set.schema.json
