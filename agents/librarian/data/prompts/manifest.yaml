fields:
  # Part 1 (D13) -- method_summary is free text (D16), the two menus are part1_enum.
  formation_structure: part1_enum
  asset_class: part1_enum
  method_summary: method_summary

  # Part 2 sort block (D19/D32). sort_signal + control_axis are signal_ref.
  sort_signal: signal_ref
  control_axis: signal_ref
  sort_kind: enum
  bucketing_method: enum
  n_groups: int
  stripe_aggregation: enum
  control_missing_policy: enum
  long_leg: enum
  signal_transform: enum
  control_n_groups: int
  combiner: enum

  # Part 2 common block (28 fields).
  eligibility_missing_policy: enum
  return_availability_policy: enum
  signal_lag: int
  lag_convention: enum
  min_bonds: int
  min_bonds_granularity: enum
  tie_break_policy: enum
  weighting_scheme: enum
  weighting_base: enum
  weight_timing: enum
  strategy_side: enum
  empty_leg_policy: enum
  transaction_cost_convention: enum
  return_label: enum
  rebalance_frequency: enum
  holding_period: int
  overlap_convention: enum
  cohort_weighting: enum
  burn_in_policy: enum
  missing_return_policy: enum
  realisation_min_survivors: int
  return_compounding: enum
  significance_convention: enum
  hac_lags: int
  annualisation: enum
  rf_convention: enum
  benchmark_model: enum
  expost_trim: enum

  # paper_facts (v1.1) -- a SEPARATE spec-level block, not Part 2 execution
  # fields. Extracted like any other field; consumed only by the analysis.
  #
  # universe_filter is DELIBERATELY UNBOUND: it is free prose, so it needs a
  # prose field-type that does not exist yet, and G3 scores prose under a rubric
  # (D34: declared weaker, excluded from headline accuracy) which is not authored
  # either. Binding it to `enum` would fail loud in _menu_for -- correctly, since
  # there is no menu. It is filled as UNKNOWN(not extracted) until both land.
  sample_start: date
  sample_end: date
  claimed_headline_metric: paper_metric

# --- run-template bindings (WS-3) --------------------------------------------
# Whole-paper structured calls, bound by NAME (not by field). The enumeration
# stage (D20) returns the full construction list in one structured call; it is a
# run_template, so the FIELD_KINDS gate does NOT apply. Same freeze discipline as
# the field-type templates: the loader recomputes the prompt byte-hash and asserts
# it equals the recorded sha256.
  # --- Scope B (2026-09-04): the 8 ASKED estimation fields (schema v1.2).
  # The 3 prose fields are bound to `prose` but registered not-asked (hybrid).
  model_family: estimation_enum
  estimation_algorithm: estimation_enum
  intercept_spec: estimation_enum
  estimation_mode: estimation_enum
  inference_method: estimation_enum
  n_factors_preferred: int
  oos_split: int
  n_factors_tested: int_set
  return_variable: prose
  characteristic_preprocessing: prose
  managed_portfolio_construction: prose

