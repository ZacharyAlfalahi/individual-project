# Prompt/schema/decoding manifest (build brief §5.3, D10/D24).
#
# Parameterised prompt templates BY FIELD-TYPE (not one per field): the enum,
# int, signal_ref, method_summary, and part1_enum families. Each field-type binds
# one prompt template + one JSON schema (structured-decoding contract) + one
# decoding config (temp 0, structured). Every template records its sha256 so a
# silent edit to a frozen prompt is caught at load (the same freeze discipline as
# the silence-policy byte-hash); the loader recomputes and asserts equality.
#
# The `fields` block maps every Part 1 field + every field already final in the
# committed Part 2 inventory (ALREADY_FINAL_PART2) to its field-type. Scope note
# (build brief §5.3): this is exactly the no-S3-dependency set; S3-adjudicated
# fields' prompts land post-S3. sort_signal / control_axis are the signal_ref
# type; method_summary is its own free-text type; the two Part-1 menus are
# part1_enum; the ints are int; everything else is enum.

version: v1

# --- field-type template bindings (paths are relative to agents/librarian/data)
field_types:
  enum:
    prompt: prompts/enum.prompt.txt
    schema: schemas/enum.schema.json
    decoding: decoding/enum.decoding.yaml
    sha256: a115773c000f8c1588c3ae003bf870a3f34dfa18e47bcbab094a0ef5246d5522
