# Concept -> Column table (D27) -- v2
#
# The Quant side of the D22/D27 wall. Maps a Signal Concept Registry concept id
# (+ its canonical parameter tuple) to the panel COLUMN NAME the engine sorts on.
# The Librarian never sees this file (it speaks concept ids only, D3); the adapter
# reads it to turn a SignalRef into a Binding(BOUND, column=...).
#
# WALL-SPLIT (D27). The registry (agents/librarian/data/signal_concept_registry.yaml)
# carries ids/definitions/aliases/params and NO columns; this table carries the
# columns and mirrors that registry. `registry_version` below MUST equal the
# registry version a spec was extracted under -- the adapter asserts the handshake
# before any lookup (a version drift refuses the run upfront, D27(1)).
#
# MIRROR RULE (D27). Exactly one column per (concept_id, canonical parameter
# tuple): the table is a FUNCTION, so a bind is never AMBIGUOUS (the adapter's
# mirror rule -- the type admits AMBIGUOUS, the producer forbids it). A duplicate
# (concept_id, params) key is a build error (the loader rejects it).
#
# GROUNDING (v2). Five concepts are grounded verbatim to the anchor factor panels
# (agents/quant/library/bbw_factors.py + the anchor golden rulebooks): the column
# name each concept resolves to is unambiguous everywhere it appears.
#
#   concept_id                 -> column     grounded from
#   var_5pct                   -> var_5pct   drf score      (bbw_factors.py; test_bbw_factors.py)
#   credit_rating              -> rating     drf control / crf score (bbw_factors.py)
#   past_6m_cumulative_return  -> mom6       mom6 score     (build_mom6.py; test_mom6_factor.py)
#   bpw_gamma                  -> gamma      lrf score      (bbw_factors.py)
#   prior_1m_excess_return     -> xret       str score      (gold_str_drr_2026.md; build_str.py)
#
# prior_1m_excess_return GROUNDED in v2 (resolved 2026-07-12). Canonical column =
# `xret` -- the engine-contract EXCESS return already present in every view() panel
# (views.py), matching the concept's definition ("excess return over the prior
# month") and the IPCA precedent (str_reversal <- xret, build_ipca_panel.py:76).
# `xret` is not reserved and needs no materialisation, so a SignalRef resolves BOUND
# with zero new column. NOTE: the column NAME (`xret`) != the concept id -- the D27
# table is a function, not a naming convention (cf. past_6m_cumulative_return->mom6,
# credit_rating->rating), so no rename of the shared `ret`/`xret` columns is made.
# The ranking is identical to sorting on raw `ret` (rf nets out cross-sectionally
# each month), so this grounding leaves the str factor unchanged.
#
# DEFERRED (v2 -- two registry concepts intentionally ABSENT here, so a SignalRef to
# one resolves MISSING -> the factory refuses MISSING_BINDING). Conservative: inventing
# a column would be a "wrong-STATED is poison" hazard.
#   maturity, size -- no characteristic-sort anchor gold binds a column for these.
# When a canonical column is chosen these land as versioned edits (v3).

version: v2
registry_version: v1

rows:
  - concept_id: var_5pct
    params: {}
    column: var_5pct
  - concept_id: credit_rating
    params: {}
    column: rating
  - concept_id: past_6m_cumulative_return
    params: {}
    column: mom6
  - concept_id: bpw_gamma
    params: {}
    column: gamma
  - concept_id: prior_1m_excess_return
    params: {}
    column: xret
