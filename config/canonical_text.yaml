# Machine-readable canonical-text freeze (parser brief §8 / PB-3).
# The single source of truth for the parser + normalisation recipe. The
# pipeline's canonical-text builder reads THIS file; it never re-hardcodes
# the rules. Report and config disagreeing is a build error.
# Frozen by the bake-off on 2026-07-10. ladder_version v2 amends brief §6
# (see docs/parser_bakeoff_report.md 'Amendment to brief §6').
#
# v3 (2026-07-22, D40): `dash_unification_word_flanked` -> `dash_unification`.
# The complete dash class (U+2010..U+2015, U+2043, U+2212) folds to ASCII "-"
# UNCONDITIONALLY. v2 covered only en/em dash and only when word-flanked, so
# U+2212 MINUS SIGN -- 1,034 occurrences, the most common non-ASCII character in
# the corpus -- was never unified, and the flanking condition meant adding it to
# the v2 class would not have helped ("t −6" has a space before the minus).
# Every member is a 1:1 substitution, so the change is LENGTH-PRESERVING: all
# 57 gold STATED locators slice back byte-exact before and after, and the 59/59
# backfill re-verifies unchanged. See the D40 entry for the full record.
parser:
  name: pymupdf
  version: 1.28.0
normalisation:
  ladder_level: L1
  ladder_version: v3
  rules:
  - nfkc
  - ligature_expansion
  - curly_quote_unification
  - dash_unification
  - whitespace_collapse
  - strip_space_before_punctuation
page_canonicalisation:
- strip_publisher_watermark_v3
normalise_sha256: abe11ff63b76df2e46a775a70f1feb397d10fa59984bafd38d312b178b01a79e
report: docs/parser_bakeoff_report.md
