# docs/scientist_protocol.yaml
# =============================================================================================
# Pre-registration protocol for the Scientist (RQ4 — post-correction extension survival).
# Committed and git-tagged (`scientist-prereg`) BEFORE the first real generation run
# (spec §4; §13 prohibition 1). Store PARAMETERS; DERIVE thresholds in code — never store a
# derived value. Design source: docs/scientist/scientist_spec_v1.md (design-locked).
#
# STATUS: committed and tagged (`scientist-prereg`), after the eligibility census filled
# generation.proposals_per_strategy.per_strategy. One item remains open:
#   * costs.source is UNRESOLVED (see the costs block) — must be cited before a live run.
#
# AMENDMENTS TO THE DESIGN-LOCKED SPEC §4 (each supersedes the cited passage; logged here so a
# reader sees exactly where implementation departs from the spec text and why):
#   A1  Two windows named explicitly + T = 209. Spec §4 named no window; §4.1 used ~234 (the
#       PANEL length). The primary-inference length is 209 months — DRF/CRF are NaN until
#       2004-08 (24-month rolling burn-in). Verified against
#       data/development/factors/bbw_factors.parquet.
#   A2  proposals_per_strategy is a per-strategy MAPPING, not the scalar 6 (spec §4). The
#       eligibility census (§6) may force m < 6 for a strategy; a scalar mispropagates.
#   A3  deflated_sharpe.n_trials = that strategy's m (mapping), not a global 6 — same reason.
#   A4  CPCV embargo is in MONTHS, not blocks (spec §4 embargo_blocks: 1). At T = 209 a "1
#       block" embargo (~26 mo) plus two test blocks strips ~half the sample per split.
#   A5  Holdout opening is gated on ARTEFACT CONDITIONS, not a self-opening date (spec §4
#       opens: 2026-08-03, derived from the retired 2-Aug lock). A bare date opens itself.
#   A6  seeds.k = 5, holdout.cap = 3 (spec left both OPEN — §16 O1/O2).
#
# amendment_policy: >
#   Once git-tagged, every change is a LOGGED amendment appended to `amendments` below (date +
#   rationale) — never a silent edit. The tag's force is entirely that it precedes the results.
# =============================================================================================

version: 1.0.0
estimand: post_correction_extension_survival

windows:
  # Verified against data/development/factors/bbw_factors.parquet + monthly_panel_corrected.
  panel_development:
    start: 2002-07
    end: 2021-12
    n_months: 234
    note: monthly_panel_corrected span; the calibration/development set (2002-2021).
  primary_inference:
    start: 2004-08
    end: 2021-12
    n_months: 209                # T — the ONLY length used for MDE / BH / DSR / CPCV geometry.
    binding_factors: [drf_corr, crf_corr]
    note: >
      BBW-4 joint corrected window: DRF and CRF are NaN until 2004-08 (24-month rolling
      burn-in); MKT_Bond and LRF span the full 233. NOT 234, NOT the panel start.
    warming: >
      F6 (burn-in). T1/T2 templates use expanding_window_past_only (min 60 months). The macro
      conditioning series (baa_aaa_spread, vix, term_spread) are ingested from >= 1997-07
      (>= 60 months before the 2002-07 panel start) so the expanding window is fully warm at
      2004-08 and effective T stays 209 for EVERY template — otherwise a panel-resident window
      would make T1/T2 candidates' first valid threshold ~2007-07 (T ~ 174) and the MDE bars
      would move by sqrt(209/174) ~ 1.10. This uses pre-sample macro data (1997-2001, outside the
      2002-2021 development window) PURELY to warm a threshold; it is NOT a holdout violation (the
      holdout is forward, 2022-01..2025-09 per SC-SCI-12, correcting SC-SCI-10). Recorded here + in
      docs/data/registers/scope_changes.md so an auditor reads it in a spec, not discovers it in
      a script.
  evaluation_holdout:
    # History: {2024-12, 36} at tag scientist-prereg (with a note forbidding "2022-2025" for this
    # window); {2025-12, 48} by SC-SCI-10 (2026-08-05) — premise FALSE, the pull terminates
    # 2025-09-30; {2025-09, 45} by SC-SCI-12 (2026-08-07) — the frontier-completeness condition is now
    # MET (WRDS saved-query date parameters PI-verified 2026-08-08), so the window is settled, with the
    # tagged 36-month sub-window always reported as sensitivity (spec SC-SCI-13).
    # 45 is a third option adopted after the 2026-08-06 completeness gate resolved to "partial" —
    # see SC-SCI-12 for the disclosure. holdout_end_year=2025 (thresholds.yaml) = year-grain ingest
    # ceiling, unchanged and distinct from this month-grain window.
    start: 2022-01
    end: 2025-09
    n_months: 45
    note: >
      The locked out-of-sample split (the evaluation window) is 2022-01..2025-09 (45 months): the
      complete-months span of the ingest partition, whose pull frontier is 2025-09-30. Ruled by
      SC-SCI-12, superseding SC-SCI-10's false 48 / end-2025-12. The frontier-completeness condition
      SC-SCI-12 attached is MET — the WRDS saved-query date parameters for the 2026-06-09 pull (range
      2002-07-01 – 2025-09-30) were PI-verified 2026-08-08 (docs/data/registers/citations_verified.md
      §3) — so the 45-month window is settled; the tagged 2022-2024 sub-window is always reported
      alongside as sensitivity (SC-SCI-13). holdout_end_year=2025 in thresholds.yaml is the
      year-grain ingest raise-CEILING (an upper bound, not the data end), distinct from this
      month-grain window; the window ends 2025-09 and does NOT coincide with it. The frozen holdout
      script asserts these exact values before its one-shot execution.

entry:
  condition: failed_at_least_one_auditor_check
  evaluated_at: corrected_lattice_point
  refused_strategies: excluded_from_numerator_counted_in_denominator
  # O8 — interaction-borne entry fallback (spec §16 open item; committed now so it is not
  # invented after seeing a result). The per-toggle first-order rule (thresholds.yaml
  # scientist.entry_rule) is primary; expected incidence here is zero (all three anchors are
  # main-effect-dominated).
  endpoint_gap_fallback: >
    A strategy whose individual toggle effects are each sub-threshold but whose saturated
    endpoint contrast Y(all-ON) - Y(all-OFF) is materially performance-reducing enters via the
    endpoint gap, applying the SAME materiality_threshold_ref and sign direction (< 0) to that
    saturated contrast as the first-order rule applies per toggle.

generation:
  # A2 — per-strategy mapping. `per_strategy` is FILLED BY the eligibility census:
  # {strategy_id: min(default, n_eligible)}, requiring >= 8 eligible mechanisms or a documented
  # cut. Until then every strategy uses `default`.
  proposals_per_strategy:
    default: 6                   # m — spec §4 default
    # FILLED BY CENSUS (2026-07-30; exhaustive sweep 2026-08-01): the eligibility census yields 11
    # conceptually-distinct mechanisms for CHARACTERISTIC_SORT (>= the 8 gate), so m = min(6, 11)
    # = 6 for each anchor. The actual ENTRY set (which anchors are correction-sensitive) is
    # Auditor-gated; m is set.
    per_strategy: {str: 6, mom6: 6, drf: 6}
  seeds:
    k: 5                         # A6 / O1 — ~30 proposals/strategy for the generation-quality arm
  economic_execution_seed: 0
  structured_decoding: true
  invalid_proposals: counted_never_regenerated

equivalence:
  key: [mechanism_id, template_id, canonicalised_config_delta]

inference:
  primary_test:
    statistic: benchmark_alpha
    factor_set: BBW4
    sided: two
    hac: newey_west
    lag_rule: floor_T_pow_0.25
  secondary_benchmark:
    # POINT-11 ESCALATION. BBW-4 (Bai-Bali-Wen 2019) is retracted (retraction notice JFE 150(3),
    # 2023). If DFPS show DRF/CRF/LRF are spanned by MKT_Bond, then alpha vs BBW-4 approximates
    # alpha vs MKT_Bond alone — a weak benchmark makes extension alpha easier and INFLATES the
    # RQ4 endpoint (a bias in the primary endpoint, not a write-up caveat). BBW-4 stays PRIMARY
    # (changing it breaks the replication chain to the corpus strategies); this secondary
    # benchmark is reported ALONGSIDE it, and BOTH go in the tag so neither is chosen post-hoc.
    factor_set: DFPS4
    source: "Dick-Nielsen, Feldhutter, Pedersen & Stolborg (2026), papers/pdf/Corporate bond factors replication crisis.pdf"
    status: pre_registered_build_pending      # constructed with the G3 inference gate
  secondary_test: paired_difference_vs_corrected_parent
  descriptive_only: comparison_vs_as_published
  bh_fdr_q: 0.10                 # proposal-family BH level. Coincides with auditor.fdr.q by
                                 #   design (§7.2) but is the Scientist's OWN inference
                                 #   parameter over a NEW family (proposals) — distinct from the
                                 #   entry-rule q, which REFERENCES auditor.fdr.q (R3).
  families:
    - llm_researcher             # per strategy
    - retrieval_only             # per strategy
    - random_eligible            # per strategy
    - extension_1_standalone     # single hypothesis, not a family
  equivalence_test:              # SC-SCI-14 — development-window TOST (two one-sided tests): is a
                                 #   residual alpha provably inside [-delta, +delta]? Its OWN joint
                                 #   BH-FDR family, SEPARATE from the proposal `families` above; a
                                 #   FAILURE to establish equivalence is never evidence of a non-zero alpha.
    method: tost
    margin_ref: scientist.equivalence_margin   # delta = 0.5*vartheta (thresholds.yaml), DERIVED in code
    bh_fdr_q: 0.10               # this family's own BH level; never pooled with the proposal families
    window: development_only     # needs >= 60 months; the 45-month holdout cannot host it
    asymmetry: failing_equivalence_is_not_evidence_of_nonzero_alpha

cpcv:
  n_groups: 8
  test_groups: 2                 # -> 28 combinations, 7 paths
  purge: per_candidate_information_span   # signal_lookback + holding_period + conditioning_lag
  embargo:                       # A4 — MONTHS, not blocks; decoupled from n_groups
    rule: holding_period_months
    floor_months: 1
  ddof: 1                        # matches the wrapped Auditor Sharpe convention

deflated_sharpe:
  n_trials: per_strategy_m       # A3 — = proposals_per_strategy[strategy]; justified by
                                 #   INVARIANT 1 (the wall makes N_trials a structural fact).

pbo:
  scope: realised_family_only
  status: supplementary_caveated # coarse at m = 6; reported with a caveat, never gating.

costs:
  # SOURCE UNRESOLVED. Spec §4 cites docs/domain_facts.md, which does NOT exist — the 40/80 bp
  # round-trip figures currently have no substantiating citation anywhere in the repo. FLAGGED
  # citation required; a strict consumer must treat `source: UNRESOLVED_pending_citation` as unmet
  # and refuse to net figures until a real source lands.
  round_trip_bps: {investment_grade: 40, high_yield: 80}
  source: UNRESOLVED_pending_citation
  report_net_beside_every_gross_figure: true

selection:
  rule: lexicographic
  order: [valid_and_executed, audit_clean, bh_survivor,
          cpcv_criterion_met, max_median_cpcv_path, simpler_intervention]

holdout:
  advance: all_cpcv_qualified_survivors
  cap: null                      # SC-SCI-14 (2026-08-24) — the advancement cap is REMOVED (was A6/O2
                                 #   cap:3). The RQ4 numerator is now ALL CPCV-qualified survivors, not a
                                 #   capped top-k; null => no cap (select_g5 advances every survivor).
  descriptive_only: true         # SC-SCI-14 — the holdout is ONE protected observation: it reports
                                 #   sign + paired difference + interval per candidate. No binary
                                 #   success/failure verdict.
  no_family_level_success_claim: true   # SC-SCI-14 — no "at least one candidate worked => RQ4 succeeds"
                                 #   success-rate over the holdout family. Registered BEFORE the qualifier
                                 #   count is known (register-before-run).
  accesses: 1
  # A5 — artefact-gated, NOT a self-opening date. The build enforces every condition; a bare
  # date backstop (if used) must never be the trigger.
  open_conditions:
    require_all:
      prereg_tag_present: scientist-prereg
      frozen_script_hash_matches_manifest: true
      explicit_env_var: SCIENTIST_HOLDOUT_UNLOCK
      single_access_assertion: true
    every_access_logged: true
    earliest_date_belt_and_braces: null   # optional far-future backstop; MUST NOT be the trigger

amendments:                      # logged amendments appended here post-tag (see amendment_policy)
  - id: SC-SCI-7
    date: 2026-08-02
    finding: F8
    summary: >
      Executability re-census. The reachability census verified variable AVAILABILITY but not
      engine EXECUTABILITY: the audited engine natively runs only T4 (independent double-sort,
      holding_period=1). T1/T2/T3 are realised as Scientist-side PANEL TRANSFORMS (T1/T2 month
      filter, T3 row filter) running the unmodified engine on the transformed panel. Eligibility
      is now executability-aware. Executable distinct-mechanism counts: str 11, drf 11, mom6 9 —
      all >= 8, so proposals_per_strategy stays 6/6/6 (reason corrected, not the number).
      G2 gains: row-filter ex-ante provenance; month-filter lag + expanding-window (never
      full-sample median). See prereg/design_findings.md, prereg/executability_census.md.
  - id: SC-SCI-8
    date: 2026-08-02
    summary: >
      Sign-aware survivors + directional CPCV gate. The pre-registered two-sided primary test and
      the BH family are UNCHANGED; the survivor label is narrowed to bh_rejected AND alpha in the
      strategy's claimed direction (direction=+1, or -1 for str winners-losers), and G4's CPCV gate
      uses direction*median_sharpe>0 (fixing the latent bug that silently failed every negative-
      premium str extension). Strictly conservative (can only reduce survivors). The two-sided
      bh_rejected is retained as a measurement; rejected-but-wrong-signed extensions are reported as
      wrong_signed (a real RQ4 finding), NOT a 7th outcome label.
  - id: SC-SCI-9
    date: 2026-08-03
    summary: >
      Rung-3 phase_d wiring. The deferred generative rung (llm_researcher) is WIRED to the real
      free-dev vendor pair (D4 phase_d: Gemini 3.1-flash-lite + Mistral-small) via
      agents/scientist/researcher/phase_d_client.py, REUSING the Librarian vendor backends
      (make_backend) rather than reimplementing SDK plumbing; config lives in thresholds.yaml
      scientist.model_stack (fail-loud loader). Generation temperature = 0.7 so the k-seed
      generation-quality arm has genuine seed-to-seed diversity — reproducibility is by CACHE-REPLAY
      (the seed-keyed ResponseCache, R5), NOT vendor determinism (a tunable, flagged for review).
      phase_d stays NON-reportable (free dev pair); reportable generative figures still require
      phase_f (Sonnet 4.6 + Gemini 3.5-flash) + SKU/cost authorization. A LIVE run additionally needs
      GEMINI_API_KEY/MISTRAL_API_KEY + the vendor SDKs installed. The upstream blocker (a real Auditor
      AuditReport / corrected QuantConfig) cleared 2026-08-03 (the core-lattice runs executed).
  - id: SC-SCI-10
    date: 2026-08-05
    status: SUPERSEDED             # by SC-SCI-12 (2026-08-07): the 48-month premise is FALSE (the pull
                                   # ends 2025-09-30), so the window is 2022-01..2025-09 (45 months).
    summary: >
      SUPERSEDED BY SC-SCI-12 (2026-08-07) — this entry's 48-month / 2022-2025 ruling rests on a false
      premise (the pull terminates 2025-09-30, so calendar-2025 holds only 9 of 12 months); it is
      retained as history. The governing window is 2022-01..2025-09 (45 months). Original text follows.
      POST-TAG AMENDMENT — holdout evaluation window ruled 2022-2025 (48 months), the full
      /data/holdout/ partition, superseding the 2022-2024 window stated at the tag (the holdout
      block comment in this file, the SC-SCI-3 caveat, ARCHITECTURE.md RQ4) and resolving FINAL decision
      log open item O6. A definitional deviation from the interim pre-registration, ruled
      2026-08-05 BEFORE any holdout read (no holdout artefact accessed; the walk-forward split is
      intact — every evaluation month remains post-development, so this is added forward sample,
      not leakage). Consequences: OOS T rises 36 -> 48 months; the 60-month support floors still
      bind (48 < 60), so amendment A7 (docs/shared_evaluation_amendments_index.md — floors scoped
      to development-window diagnostics, short_sample degrade path, no holdout bootstrap
      intervals) applies unchanged; extension_1's frozen development median classifies the
      2022-2025 months (the config's 2022-2024 references are updated to 2022-2025 as
      propagation of this ruling, not a methodology change).
  - id: SC-SCI-11
    date: 2026-08-05
    status: APPROVED               # E2 approval 2026-08-06: sigmas approved as stated below;
                                   # DRAFT->tagged transition recorded in the register; tag
                                   # sc-sci-11-posterior-prereg applied at the WS-A commit —
                                   # the door is provably shut before any credentialed run.
    summary: >
      POST-TAG AMENDMENT — Bayesian posterior PRESENTATION layer on holdout extension
      alphas (extensions programme P3/WS-A; renumbered from the build spec's "SC-SCI-10", which
      was consumed by the holdout-window decision). SCOPE: presentation only, over the
      confirmatory outputs — BH-FDR remains the sole decision rule; no gate logic changes
      (G0-G6 decisions are pinned unchanged by tests/unit/test_p3_gate_invariance.py). For each
      extension evaluated on the holdout, P(alpha > 0 | data) is reported under three pre-stated
      zero-centred normal priors on MONTHLY holdout alpha, beside the frequentist CI and paired
      test, via shared/stats/posterior.py (the d=1 case of the Auditor's pre-registered normal
      approximation; agreement pinned by unit test). PRIOR SET (sigmas APPROVED 2026-08-06, E2):
      (i) wide sigma = 0.02 (weakly informative; matches auditor.bayes.prior_scale);
      (ii) moderate sigma = COMMITTED FORMULA, not a number: the sample SD of the development-
      window G3 extension alphas across the confirmatory proposal family, computed at the
      G5->G6 boundary and logged BEFORE holdout access — development-only information, so
      legitimately pre-holdout; FALLBACK sigma = 0.005 if the development generation stage has
      not produced alphas when the posterior layer is exercised;
      (iii) sceptical sigma = 0.0025. SENSITIVITY: all three reported, always — no single-prior
      presentation. SE derivation: alpha/alpha_t from the G3 NW-HAC output
      (shared.stats.alpha_se_from_t), or from the inference routing's CI under the same normal
      approximation. HONESTY RULE (verbatim, binding): "The posterior is a re-expression of the
      same data beside the frequentist interval — never independent corroboration."
      INTERPRETATION LANGUAGE (pre-committed): posteriors are reported numerically; no
      qualitative adjectives are attached to them in any report, and a mid-strength posterior
      is never narrated as encouraging.
  - id: SC-SCI-12
    date: 2026-08-07
    status: APPROVED               # Ruling 2026-08-07 ("45-month holdout"). CONDITION MET + VERIFIED:
                                   # the frontier-completeness evidence is cited in citations_verified.md
                                   # §3, strengthened 2026-08-08 by PI verification of the WRDS saved-query
                                   # date parameters (range 2002-07-01 – 2025-09-30) — the 2026-08-07
                                   # residual (raw WRDS query log) is thereby resolved. Ruled before any
                                   # holdout read — no holdout artefact/listing/metadata query accessed.
    summary: >
      POST-TAG SUPERSESSION — SC-SCI-10 is superseded; the holdout evaluation window is
      2022-01..2025-09 (45 months), the complete-months span of the ingest partition.
      FACTS: the pinned 2026-06-09 WRDS re-pull terminates 2025-09-30 (PI-verified 2026-08-08 against
      the WRDS saved-query date parameters — range 2002-07-01 – 2025-09-30 — cited in
      citations_verified.md §3; a write-time documentary artefact, never a partition read). This confirms
      fl_d21_gate_results.md's "~2025-09" as precise; the trace_preprocessing.md §2 "~2025-06-29"
      and sourcing-brief "~2025-06" records are erroneous, corrected by errata. SC-SCI-10's
      "48 months / window coincides with the partition boundary" is therefore FALSE — calendar-2025
      holds 9 of 12 months and the partition at most 45; Oct-Dec 2025 do not exist in the pull.
      CHRONOLOGY (disclosed plainly, because the reader must judge it): the pre-stated completeness
      gate (2026-08-06) was BINARY — complete calendar-2025 -> 2022-2025; partial -> 2022-2024 —
      and resolved to PARTIAL. This 45-month value is a THIRD option, adopted 2026-08-07 AFTER that
      resolution, on the argument that the gate's calendar-year grain was arbitrary and every month
      through the pull frontier is complete. It is neither the gate's literal branch nor SC-SCI-10.
      TWO SAFEGUARDS make the adoption honest rather than elastic: (1) CONDITION (now SATISFIED) — the
      45-month window stood only if the frontier-completeness evidence (the WRDS saved-query date
      parameters, a write-time artefact, never a partition read) was cited before the holdout opens;
      that evidence is on record (citations_verified.md §3, PI-verified 2026-08-08), so the window holds.
      (2) SENSITIVITY — the tagged 2022-2024 sub-window is computed in the same single one-shot holdout execution
      and reported beside every registered 45-month figure (spec: SC-SCI-13), so the window move's
      effect is visible in the results, not asserted away.
      CONSEQUENCES: OOS T = 45 (SC-SCI-10's "36 -> 48" is void; it is 36 -> 45); the 60-month
      support floors still bind (45 < 60), so amendment A7 applies UNCHANGED; the frozen holdout
      script must assert window == 2022-01..2025-09 before its one-shot execution; one value
      everywhere. thresholds.yaml holdout_end_year=2025 is UNCHANGED — a year-grain ingest
      raise-CEILING (preprocess_trace.py raises beyond it), distinct from the month-grain evaluation
      window, exactly the partition-vs-window distinction this protocol insists on. Numbered
      SC-SCI-12 because SC-SCI-11 is the Bayesian posterior layer (tag sc-sci-11-posterior-prereg).
      ALTERNATIVES REJECTED: (a) retaining SC-SCI-10 — premise false; (b) reverting to 2022-2024
      per the gate's literal branch — discards 9 verified-complete, never-read out-of-sample months
      (the scarcest evidence in the project) on a calendar-grain technicality; the SENSITIVITY
      reporting preserves what that branch protected.
      PROPAGATION done by this entry: the evaluation_holdout block (this file) and the tracked
      mirror prereg/scientist_prereg.yaml, both to {end: 2025-09, n_months: 45}; the SC-SCI-3
      forward-holdout cross-references (this file + scope_changes.md) repointed here. Re-propagation
      to the 45-month value since completed: ARCHITECTURE.md RQ4, extension_1's classified months, and the
      trace_preprocessing.md errata (§2 end-date + the :19 partition-vs-window wording); the SC-SCI-10
      propagation set in the Gate-0 report is swept by the 2026-08-08 resolution commit.
  - id: SC-SCI-13
    date: 2026-08-07
    status: APPROVED               # E14 confirmed 2026-08-08; family = synchronised fixed-block per the
                                   # delegated technical call; tagged sc-sci-13-holdout-inference at the
                                   # resolution commit. Pre-registration of intent: the primary HAC-t
                                   # inference is a config not a build, but the both-window one-shot holdout computation
                                   # (clause 3) is DEFERRED with the one-shot holdout builder — a flagged build item. The
                                   # new assert_evaluation_window() helper pre-positions SC-SCI-12's
                                   # "script asserts the window" requirement ahead of that build.
                                   # CLAUSE (2) REALISED IN CODE 2026-08-09: shared/stats/holdout_bootstrap.py
                                   # (pure, no I/O — cannot read the holdout) + loader + 14 tests; writeup
                                   # docs/scientist/holdout_inference_implementation.md; deviation A8 in the
                                   # shared-eval amendments index. Clause (3) one-shot holdout caller still deferred (E14).
    summary: >
      PRE-REGISTERED HOLDOUT-INFERENCE SPECIFICATION (ships with RQ4's descriptive rewording;
      gives the SC-SCI-12 SENSITIVITY safeguard its concrete form). At T = 45:
      (1) PRIMARY inference is the paired HAC t (survivor minus parent, and each series' own alpha),
      lag pinned ex ante by the project rule floor(T^0.25) => lag 2 (holds for T = 36 and 45 alike);
      nothing chosen at run time.
      (2) The block bootstrap enters as SENSITIVITY ONLY. This clause, now confirmed (2026-08-08),
      supersedes amendment A7's "no holdout bootstrap intervals" for LABELLED-DIAGNOSTIC use alone; A7's floor
      scoping is otherwise unchanged, and no bootstrap interval on the holdout is ever confirmatory.
      Family pinned: the project's synchronised fixed-block bootstrap (B = 1000), block lengths
      {3, 6} months, effective-block counts disclosed in every table (45/6 = 7 — below the 10-block
      floor, labelled diagnostic; 45/3 = 15 — floor met, the shorter block's weaker dependence
      capture stated).
      (3) WINDOW SENSITIVITY: every registered 45-month figure is reported beside the same statistic
      on the tagged 2022-2024 sub-window, computed in the same single one-shot holdout execution — the SC-SCI-12
      window move is visible in the results, not narrated. This requires the one-shot holdout / frozen-holdout
      script to compute both windows in one pass (build item E14, not yet wired).
      (4) HAC's small-sample fragility at this T is stated as a further reason the holdout claim is
      DESCRIPTIVE, never a verdict.
      (5) No lattice inference runs on the holdout window, by design; the lattice support floor
      (min_common_months = 60) governs a different estimand and is cross-referenced, not applied.
      (6) The seed-sensitivity arm is development-only and outside this amendment.
  - id: SC-SCI-14
    date: 2026-08-24
    status: APPROVED              # TAGGED sc-sci-14-rq4-partb at the registration commit (2026-08-25),
                                  # BEFORE the holdout is opened / the qualifier count is known
                                  # (register-before-run, I5): its force is entirely that it precedes the
                                  # results. The RQ4 "Part B" bundle below is thereby pre-registered.
    finding: RQ4-PartB
    summary: >
      RQ4 Part-B registration bundle (four coupled amendments), all committed EX ANTE of the holdout
      qualifier count so none is chosen after seeing a result:
      (1) HOLDOUT ADVANCEMENT CAP REMOVED. A6/O2's holdout.cap = 3 is superseded: holdout.cap = null,
      so G5 advances ALL CPCV-qualified survivors and the RQ4 numerator is the full survivor set, not
      a capped top-k. Realised in code (select_g5 / run_experimentalist treat cap=None as "no cap",
      Python list[:None]); one-shot holdout stage-2 is unaffected (it evaluates whatever survivor list it is handed).
      The tracked register prereg/scientist_prereg.yaml is updated in lockstep (the register-agreement
      tripwire, test_scientist_prereg_register, keeps the two from drifting).
      (2) HOLDOUT DESCRIPTIVE-ONLY / NO FAMILY-LEVEL CLAIM. holdout.descriptive_only = true and
      holdout.no_family_level_success_claim = true: the holdout is ONE protected observation reporting
      per-candidate sign + paired difference + interval; there is no binary success/failure verdict and
      no "at least one candidate worked => RQ4 succeeds" success-rate over the holdout family. This
      registers the all-qualifier, descriptive-only interpretation BEFORE the qualifier count is known.
      (3) DEVELOPMENT-WINDOW TOST EQUIVALENCE FAMILY. inference.equivalence_test registers a two
      one-sided-tests equivalence check on residual alpha over [-delta, +delta] as its OWN joint BH-FDR
      family (q = 0.10), separate from the proposal families; development-only (needs >= 60 months, so
      the 45-month holdout cannot host it); asymmetric (failing equivalence is never evidence of a
      non-zero alpha). This reverses the earlier §4.9.1-era refusal to run an equivalence test, on the
      D-E7 condition that a pre-registered margin exists (see item 4); the reversal is disclosed here.
      (4) EQUIVALENCE MARGIN delta = 1/2 * vartheta = 5 bp/month, registered in thresholds.yaml
      (scientist.equivalence_margin) as a DERIVED value (factor_of_vartheta = 0.5 * the auditor
      materiality floor vartheta = 0.001), never a stored literal — a residual must lie inside a STRICTER
      half-width than the material-effect floor before being called approximately zero. A deliberate
      design choice (half of vartheta), not a universal constant. Adding this thresholds.yaml key
      re-pins FROZEN_THRESHOLDS_SHA256 (agents/scientist/experimentalist/oneshot_holdout/frozen.py); the one-shot holdout real
      one-shot has not run, so the re-pin is maintenance, not a provenance break.
