# All numerical thresholds for the pipeline.
# Auditor reads this at runtime — nothing is hard-coded in agent code.
# Every entry must carry a source citation.

trace_cleaning:
  # Dick-Nielsen (2009) "How to Clean Enhanced TRACE Data", p.528
  # price_floor RESTORED to 0.0 (spec v4 Part C/A4, 2026-08-04). It had been
  # raised to 1.0 as a crutch for the mis-implemented distressed filters, which
  # could not catch the ultra-low prints that produce VWAP-denominator blow-ups.
  # With the DRR-faithful filters now in place (apply_distressed_filters.py,
  # repo 42c5dea9), the floor is removed so ultra-low prints (< 1.0 % of par)
  # flow through to the distressed stage, which drops them there — DRR apply no
  # pre-distressed floor. A strict `> price_floor` still drops non-positive
  # prices. See docs/data/registers/citations_verified.md §1.
  price_floor: 0.0
  # price_ceiling is the decimal-shift TARGET band: a corrected price must land
  # in (price_floor, price_ceiling], so every shift already lands <= 300. This
  # realises DRR's price_threshold=300 final filter (repo Step 9) IN-PLACE — a
  # separate post-distressed "drop price > 300" would be a no-op on identical
  # data, so it is not added (documented equivalence, spec v4 Part C6 / user
  # decision 2026-08-04). DRR's dip_threshold=35 (the narrow 2002-07 first-change
  # filter) is NOT yet wired — a documented faithfulness deferral (citations §1).
  price_ceiling: 300.0
  # Project design decision — committed before first run, never changed.
  # Holdout window is the closed interval [holdout_start_year, holdout_end_year]
  # = 2022–2025 (the 2026-06-09 WRDS re-pull runs into 2025). holdout_end_year
  # is an EXPLICIT upper bound: preprocess_trace.py raises if a future re-pull
  # carries rows beyond it, so the window cannot silently creep — extending it
  # must be a conscious edit here (and in the docs).
  holdout_start_year: 2022
  holdout_end_year: 2025
  # Dick-Nielsen (2009) Table 1 Panel B: keep only blank asof_cd.
  # Drops A (late report), R (reversal), D (delayed), X (cancellation).
  # Keeping "A" risks double-counting trades reported as corrections of earlier submissions.
  # NOTE: blank asof_cd in the CSV is read as NaN by pandas — the filter uses
  #   isna() | (== asof_cd_keep). The equality check alone would silently drop
  #   all on-time trades; both clauses are required.
  asof_cd_keep: ""
  # Dick-Nielsen (2009) p.528: prices above 30,000 cannot be corrected back into
  # the valid range (0, price_ceiling] by any ÷10 or ÷100 shift and are unrecoverable.
  # This is the wide pre-correction gate applied before the decimal-shift step.
  pre_correction_ceiling: 30000.0
  # Pre-2012 TRACE Enhanced universe has ~150 highly liquid benchmark bonds only.
  # 2012+: ~3,500 bonds. sub_prdct is NULL for all pre-2012 records (field added 2012).
  # Development window (2002-2021) includes both regimes; Quant agent filters sub_prdct as needed.
  universe_note: "pre-2012 sparse (~150 bonds); 2012+ broad (~3500 bonds); sub_prdct NULL pre-2012"

monthly_panel:
  # Keep straight corporate bonds + pre-2012 records (NULL sub_prdct). Drop CHRC and ELN.
  sub_prdct_keep:
    - "CORP"
    - ""
  # Institutional-size filter: drop trades below this par value threshold (Bai, Bali, Wen 2019)
  min_vol_qt: 100000
  # Bonds with no trades in a month get NaN return (never impute)
  min_trades_per_month: 1
  # Volume-weighted average price within month as end-of-month price
  price_agg_method: "vwap"
  # FRED TB3MS series: 3-month T-bill rate (annualised %) used as risk-free rate
  # Public endpoint — no API key required
  rf_rate_series: "TB3MS"
  rf_rate_url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=TB3MS"
  # FRED BAA/AAA: Moody's Seasoned Baa/Aaa Corporate Bond Yields (annualised %). The
  # BAA-AAA credit-spread is the extension_1 regime variable (docs/extension_1_config.yaml);
  # its median is computed on DEVELOPMENT only (inviolable data rule) by
  # scripts/download_baa_aaa_spread.py. Public endpoints — no API key required.
  baa_yield_url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=BAA"
  aaa_yield_url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=AAA"
  # FRED macro conditioning series for the extension templates T1/T2 (vix, term_spread).
  # Ingested from full history (>= 1997-07 warms the expanding-window threshold so effective
  # T stays 209 for every template — see docs/data/registers/scope_changes.md F6), capped at the
  # dev boundary by scripts/download_macro_conditioning.py. Public endpoints — no API key.
  vix_url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS"
  term_spread_gs10_url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=GS10"
  term_spread_gs3m_url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=GS3M"

# Signal-prep constants. Each signal is computed from the monthly panel by
# a dedicated scripts/build_<signal>.py and emitted to
# data/development/signals/<signal>.parquet keyed on (cusip, date) for
# merge-at-feed-time consumption by the engine.
signals:
  # BBW (2019) 5% VaR proxy: per-bond rolling-window n-th lowest monthly
  # return × multiplier. With window=36 and rank=2: 5% × 36 = 1.8 → rank 2,
  # which is the convention BBW use.
  var_5pct:
    window: 36          # trailing-36-month window (BBW 2019)
    min_obs: 24         # minimum non-NaN observations to compute (BBW 2019)
    rank: 2             # 2nd-lowest sorted return (BBW 2019)
    multiplier: -1.0    # higher var_5pct = more downside risk

  # A3 (registry amendments v1.1) — stale-price mask threshold.
  # mask price_eom_corr(i,t) iff month_end(t) − last_trade_date_corr(i,t) > θ
  # calendar days (strict >). Propagation: a masked p(t) invalidates both
  # ret(t) and ret(t+1) under the masked view (A3.2).
  # θ default 30; final value will come from the 01_trace_explore gap
  # distribution per A3.3 (closes O2). θ is chosen from coverage statistics
  # only — never from factor performance.
  stale_price:
    theta_days: 30
    source: "registry amendments v1.1 A3.3 (default); final value from 01_trace_explore"

  # mom6 — 6-month momentum, Jostova et al. (2013), the mom6_1 anchor
  # (docs/quant/specs/BBW_anchor_implementation_spec.md §5.2). The SIGNAL is the trailing
  # cumulative return over `formation_months` consecutive months ending at the
  # row's month; the factor runner then applies signal_lag=`skip_months` (the
  # Jostova skip) and a staggered `holding_months` hold. Deciles, equal-weighted,
  # leg = winners − losers (P10 − P1). The skip means signal_lag=1 picks the
  # window ending one month before formation, leaving month t unused.
  mom6:
    formation_months: 6     # J: trailing cumulative-return window (months t-6..t-1 at formation)
    min_obs: 6              # require all 6 consecutive months (strict); NaN otherwise
    skip_months: 1          # engine signal_lag (gap between formation window and holding)
    holding_months: 6       # H: staggered/overlapping hold (Jostova)
    n_groups: 10            # deciles P1..P10
    weighting: "equal"      # equal-weighted within decile (Jostova; NOT value-weighted)

  # str LIB decomposition (docs/quant/specs/BBW_anchor_implementation_spec.md §5.1/§8) — the
  # intra-month price-window length for the month-end vs month-begin reversal
  # decomposition. "first/last 5 business days of the following month" (§5.1).
  # CONFIRM-ON-READ exact length vs DRR-2026 code (§9/§11).
  str_lib:
    window_days: 5

  # gamma / ILLIQ (BPW 2011 eq.2; docs/quant/specs/BBW_anchor_implementation_spec.md §1) — the one
  # new characteristic. gamma = sign_multiplier * Cov(Δp_d, Δp_{d+1}) over
  # consecutive within-month daily log-price changes (daily price = within-day VW
  # clean price). Higher gamma = more illiquid. Screen = DRR-2023 RELAXED (default),
  # NOT BPW's strict screen — a deliberate DESIGN choice (§1.3): formula is BPW's,
  # thresholds are DRR's. BPW-strict retained as a documented non-default flag.
  gamma_illiq:
    min_pairs: 5            # >= 5 paired (Δp_d, Δp_{d+1}) obs in the month, else NaN (DRR §3.1 fn.1)
    max_gap_bdays: 7        # inter-trade gap to recognise a daily change: <= 7 business days (DRR)
    sign_multiplier: -1.0   # x(-1) so higher gamma = more illiquid (BBW/DRR convention)
    cov_ddof: 1             # sample covariance over the month's paired changes
    bpw_strict:             # rejected pure-BPW alternative (fn.10); off by default (§1.3)
      enabled: false
      min_pairs: 10         # BPW require >= 10 paired observations
      min_bday_frac: 0.75   # AND >= 75% of the month's business days traded

  # bond_vol — 24-month rolling bond-return volatility. This is KPP's TOTAL_VOL (Table A.I #27)
  # AND the scaler for the VOLScaled010 return-scaling lane. Computed from monthly EXCESS returns
  # per family (xret_raw / xret_corr). `window` = trailing-month window; `min_obs` = eligibility
  # gate (a DESIGN choice — enough history for a stable std). Decimal monthly units. The vol floor
  # (0.01) used when scaling lives in agents/quant/library/configs/kpp_ipca.yaml:scaling.vol_floor.
  # Source: [CODE JF2_pubdata.m:151 (TOTAL_VOL #27); PAPER fn.32]; consumed by Workstream B
  # (scripts/build_bond_vol.py + scripts/build_ipca_panel.py), per docs/quant/specs/characteristic_registry_spec.md.
  bond_vol:
    window: 24
    min_obs: 18

# RQ2/RQ3 bias toggles (docs/quant/specs/BBW_anchor_implementation_spec.md §7). Each reproduces a
# published defect on demand; both OFF (as-published) and ON (corrected) states
# are produced and the gap is the measured bias.
bias_toggles:
  # lab_filter — mom6 return-level outlier trim (Jostova fn.16). TWO EXPLICIT MODES
  # (spec E1). jostova_faithful = DELETE (truncate) returns above the full-sample
  # 99.5th right-tail percentile, RECOMPUTED per lattice cell on that cell's own
  # panel (method-faithful, not a fixed ~30%; spec E1/E2a) — this is the AUDITOR
  # LATTICE OFF arm. drr_triangulation = winsorise/clip at the same threshold —
  # EXTERNAL triangulation only (the standalone gates run_mom6_lab_gate.py /
  # run_accrual_validation.py, which winsorise). The lattice estimand is
  # `expost_return_filter` — a registered operationalisation of LAB, NOT a pure
  # timing estimate (spec E2). loc=right is one-sided (Jostova).
  # NAMING CLOSURE (2026-08-08): `lab_trim` is retained as the toggle's registered id AND display
  # name; the `expost_return_filter` rename (D18) is CLOSED-REJECTED. D18's SUBSTANCE stands — the
  # registered look-ahead operationalisation, the jostova_faithful / drr_triangulation modes, and the
  # EP−EA paired reporting are unchanged; only the rename is withdrawn. (`lab_filter` here is the
  # distinct config-block key for the trim's numeric params — a different name, not renamed.)
  lab_filter:
    level: 99.5
    loc: right
    adj: wins                        # the drr_triangulation (external) action = clip
    # PRE-REGISTERED CONSTANT (spec E binding condition 2, committed before any run):
    # the interpolation convention for the full-sample percentile resolution. The
    # engine must NOT inherit a library default; numpy/pandas 'linear' is the
    # standard, made explicit here — a project on researcher degrees of freedom
    # cannot leave the convention implicit.
    percentile_interpolation: linear
    # The AUDITOR LATTICE OFF arm uses jostova_faithful = truncate (delete), per the
    # gold's 'eliminated' wording (gold_mom6_jnps_2013.md); adj:wins above is the
    # EXTERNAL-triangulation action only. Do not conflate the two.
    lattice_action: truncate
  # lead_lag — BBW factor lead/lag (look-ahead) error (§7 toggle 1). OFF injects
  # the original BBW defect, ON is the correct contemporaneous alignment; the
  # signature is the original↔replicated correlation collapse (~0.26 DRF / ~0.44
  # CRF) restored to >0.90 when corrected. Defect windows (DRR-2023):
  lead_lag:
    drf_crf_lead_months: 1          # DRF/CRF month t carried t+1's value (lead) ...
    drf_crf_window: ["2004-08", "2014-12"]
    lrf_lag_months: 1               # LRF month t carried t-1's value (lag) ...
    lrf_window: ["2015-01", "2016-12"]
  # Month-end trade-recognition window n (§7 toggle 4) — affects universe size
  # only, NOT the price-measurement window (signals.str_lib.window_days).
  trade_recognition_window_n: [1, 3, 5, 7, 10]

# Anchor validation principle (docs/quant/specs/BBW_anchor_implementation_spec.md §8) — recorded
# here to supersede the ±15% absolute-level criterion FOR THE ANCHORS and to
# justify on the merits. The pipeline has many deliberate divergences from every
# external reference (par-weighting not mcap_e, a wider universe, relaxed BPW
# screens, a self-built panel, clean-price returns pending the §2.1 accrual
# upgrade), each of which moves factor MEANS by more than 15%. So the anchors are
# validated by reproducing published BIAS VERDICTS — the direction and
# approximate magnitude of each toggle's effect — within the pipeline, NOT by
# matching published factor levels.
validation:
  anchor_criterion: "construction_rulebook"  # v1.6 (2026-08-14): the RQ2 anchor
                                          # fidelity PASS CONDITION is contract §7
                                          # gates 1-2 — construction invariants +
                                          # rulebook byte-equality (G2). The §7
                                          # gate-5 bias-mechanism differential is
                                          # retained as a reported RQ3-facing
                                          # diagnostic (supersedes O5 / D-Q1, which
                                          # had made gate 5 the pass condition).
                                          # External level comparisons stay
                                          # DESCRIPTIVE; the ±15% absolute-level
                                          # criterion remains RETIRED (D16).
                                          # See docs/quant/open_item_O5_fidelity_gate.md
  gates:
    str_lib_decomposition: "month-end vs month-begin; direction + LIB proportion (§8 gate 1)"
    mom6_lab: "ex-post vs ex-ante winsorization; EP biased ~+0.30, EP-EA gap > 0 (§8 gate 1)"
    bbw_lead_lag: "lead/lag error collapses original-vs-corrected correlation to ~0.26 DRF / ~0.44 CRF, restored to >0.90 (§8 gate 1)"
    osbap_directional: "loosened sign + order-of-magnitude vs OSBAP ret_vw (directional smoke test, NOT pass/fail; needs OSBAP data)"
  # Critical guard (diagnostic-first protocol): every bias gate above is a
  # within-pipeline DIFFERENTIAL or CORRELATION, hence SIGN-INVARIANT — so all
  # are robust to the clean-price CRF sign-flip (fixed by the Chunk-5 accrual
  # upgrade). Only the osbap_directional sanity check depends on CRF's sign and
  # is expected to fail until accrual lands.
  bias_gates_sign_invariant: true
  # Numeric pass/fail bounds for the §8 bias gates, externalised from the gate
  # scripts per the thresholds-in-yaml rule. run_leadlag_gate.py,
  # run_mom6_lab_gate.py, run_accrual_validation.py, diagnose_crf_lrf.py and
  # build_str_decomposition.py read these instead of hard-coding, so the
  # thresholds_sha256 each gate records now covers them. Source: the bias
  # signatures in docs/quant/specs/BBW_anchor_implementation_spec.md §8 (DRR-2023/2026).
  gate_thresholds:
    lead_lag:
      collapse_max: 0.7      # corrupted-vs-correct corr must drop BELOW this (the lead/lag collapse signature)
      restore_min: 0.90      # round-trip re-aligned corr must rise ABOVE this (the correction restores the factor)
    mom6_lab:
      drr_band: [0.15, 0.45]  # ex-post biased premium must land in this %/mo band (DRR ≈ +0.30)
    accrual_validation:
      gap_tol: 0.10          # |mom6 EP−EA gap_total − gap_clean| stays below this (%/mo) — accrual cancels in the differential
      corr_tol: 0.15         # |lead/lag DRF corr_total − corr_clean| stays below this
    crf_lrf_diagnostic:
      lrf_lift_min: 0.0005   # rough-total LRF must exceed clean LRF by >= this (per-unit; = +0.05%/mo)
      gamma_sep_ratio: 5.0   # |top-gamma-quintile mean| must exceed this x |bottom| to confirm the sort separates
    str_decomposition:
      arm_corr_min: 0.8      # month-end vs month-begin arm correlation floor (identical-sample sanity)
      lib_share_lo: 0.6      # LIB share of the month-end reversal band [lo, hi] (SOFT: universe-sensitive — see script note)
      lib_share_hi: 1.0
      min_bonds: 20          # engine min_bonds eligibility for the decomposition sort

# DRR (Dickerson, Robotti, Rossetti 2026) bounce-back filter, Table A.2.
# Applied by scripts/bounce_back_filter.py as a post-processing step after
# preprocess_trace.py. Input and output are both trace_clean.parquet.
# Provenance and explicit divergences are documented in
# docs/data/specs/bounce_back_filter_spec.md §0.
bounce_back_filter:
  # Core spike detection (DRR Table A.2)
  threshold_abs: 35.0        # Flag a trade if |price - anchor| exceeds this (price points)
  lookahead: 5               # Number of subsequent trades to check for price recovery
  window: 5                  # Number of unique prices in rolling trailing median
  back_to_anchor_tol: 0.25   # A future price is a "recovery" if within this of anchor
  candidate_slack_abs: 1.0   # Added to back_to_anchor_tol for recovery detection

  # Cooldown after a par-block flag (DRR Table A.2, clause iii).
  # Applied ONLY when the dropped trade was flagged via par-snap (its trailing
  # window was a par-block) — matching the DRR description "rows skipped after
  # flagging par blocks". Non-par drops do not trigger cooldown.
  par_cooldown_after_flag: 2

  # Par snap heuristic — for bonds trading near par, the FLAGGING anchor
  # snaps to par_level (preventing false positives from minor median drift
  # for at-par bonds). The RECOVERY check always uses the trailing median,
  # regardless of par-snap, because recovery asks "did the bond return to its
  # actual trading level" — that is the median by construction. Coupling the
  # two created a dead zone for bonds in [par-par_band, par+par_band] off par.
  # The anchor decoupling is an extension beyond DRR; see spec §0.
  par_spike_heuristic: true
  par_level: 100.0           # Par price
  par_band: 15.0             # |price - par_level| <= par_band triggers the heuristic
  par_min_run: 3             # Consecutive trades near par required to activate

# DRR (Dickerson, Robotti, Rossetti 2026) distressed daily filters.
# PROVENANCE — port + disclose (spec v4 Part J; supersedes the prior firewall).
# The filter IMPLEMENTATION is repo-derived from Dickerson's released
# `trace-data-pipeline`, pinned commit 42c5dea93fce550089e175bb622dfd32a725b92f
# (stage1/helper_functions.py::ultra_distressed_filter; ULTRA_DISTRESSED_CONFIG
# in stage1/_stage1_settings.py; step8 in stage1/stage1_pipeline.py). The earlier
# "independent coding from the appendix; do NOT port repo code" firewall is
# RETIRED for the filter implementation — it produced a wrong implementation
# (absolute price-point gaps, a 25/50/75/100 round grid). The OSBAP / DRR
# published-OUTPUT validation firewall is UNAFFECTED (independence kept where it
# validates against their results). Full provenance + appendix-vs-repo notes:
# docs/data/registers/citations_verified.md §1.
#
# FOUR filter outputs (anomaly, spike, plateau, intraday); the round-number mask
# is a SHARED PREDICATE consumed inside anomaly/spike/plateau, NOT a fifth OR'd
# flag. All prices are % of par (100 = par). Applied by
# scripts/apply_distressed_filters.py on the corrected daily layer only (raw
# family bypasses per A1.1). Rows with any flag are DROPPED (repo Step 10a).
meas_err_distressed_filters:
  # Anomaly — isolated ultra-low/round print whose median of ABOVE-priced
  # neighbours is >= min_normal_price_ratio x the price (ratio, not a gap).
  ultra_low_threshold: 0.10       # anomaly ultra-low gate: price < this
  min_normal_price_ratio: 3.0     # flag if median(neighbours priced above)/price >= this

  # Spike — jump whose price / median(pre-window points BELOW) >= min_spike_ratio
  # that recovers to <= median_pre * recovery_ratio within the lookahead.
  high_spike_threshold: 5.0       # spike candidate LEVEL gate: price > this.
                                  # NB a RAW price level, NOT a ratio (repo l.1144);
                                  # the spike ratio is min_spike_ratio below.
  min_spike_ratio: 3.0            # flag if price / median(pre-below) >= this
  recovery_ratio: 2.0             # recovery: some post price <= median_pre * this

  # Plateau — run of >= min_plateau_days EXACT-equal ultra-low/round prices with
  # >= pre_post_price_ratio displacement on EITHER side (round runs always flag).
  plateau_ultra_low_threshold: 0.15  # plateau ultra-low gate: price < this
  min_plateau_days: 2             # minimum run length (days)
  pre_post_price_ratio: 3.0       # either-side displacement: pre/price or post/price >= this

  # Round-number predicate (shared by anomaly/spike/plateau). Operative 7-element
  # set from ULTRA_DISTRESSED_CONFIG (the repo README/function-default add 0.75;
  # the pipeline passes THIS 7-element list — see citations_verified.md §1).
  suspicious_round_numbers: [0.001, 0.01, 0.05, 0.10, 0.25, 0.50, 1.00]
  round_tolerance: 0.0001         # |price - r| < this counts as round

  # Anomaly/spike window half-widths (repo function defaults; pipeline does not
  # override them).
  lookback: 5
  lookforward: 5

  # Intraday inconsistency — low-price day with abnormal high/low range. Uses the
  # daily low/high (prc_lo/prc_hi -> min_price/max_price).
  intraday_price_threshold: 20.0  # candidate if min_price < this
  intraday_range_threshold: 0.75  # flag if (max_price - min_price)/mean(min,max) > this
  # DRR final filters (repo Step 9) for the record: price_threshold=300 is
  # realised in-place by trace_cleaning.price_ceiling (the decimal-shift target
  # band); dip_threshold=35 (the 2002-07 first-change filter) is a documented
  # deferral, not yet wired (citations_verified.md §1).

# Per-paper baseline-profile UNKNOWN-primitive promotion rule (FL-D21e / R1).
# An UNSTATED cleaning primitive (one a paper does not state) is toggled ALONE
# against the profile baseline on the DEVELOPMENT window only (2002-2021; NO
# holdout rows); it is PROMOTED to a run-both-ways envelope if ANY criterion
# fires. Non-promoted primitives take the faithful-to-silence default (not
# applied; except P4 as-of = retain, FL-D21h), tagged UNKNOWN with the diagnostic
# recorded. These are a PRE-REGISTERED, fail-loud constant set: the freeze is the
# committed + git-tagged state (FL-D21e). All three criteria are DATA-LEVEL
# (Δr and signal ranks are panel data; the D16 line sits at portfolio formation
# / premia, not returns). Promotion allocates COMPUTE, not truth — every
# non-promoted default keeps its UNKNOWN tag + recorded diagnostic.
cleaning_promotion:
  # (a) diffuse materiality — share of bond-months with |Δr| >= 1bp.
  diffuse_share_min: 0.005          # >= 0.5%
  diffuse_delta_bp: 1.0             # |Δr| >= 1 bp counts
  # (b) concentrated magnitude — max |Δr| (the str pathology). 30% is anchored to
  # the corpus's own smallest ex-post materiality bound (Jostova's trim), not invented.
  max_abs_delta_r: 0.30             # >= 30%
  # (c) selection-concentration lift = P(extreme | affected) / P(extreme | unaffected).
  # Few affected rows selected into the sort tails move a factor while (a) sleeps.
  selection_lift_min: 2.0           # >= 2
  # Fixed conventions for (c), frozen:
  #   signal set = the registered anchor sorts (frozen);
  #   extreme    = top ∪ bottom signal decile (diagnostic convention, any paper's grid).
  extreme_decile_frac: 0.10
  window: development_only          # 2002-2021; holdout never touched

# FISD reference preprocessing (scripts/build_fisd_reference.py).
# Source: WRDS Mergent FISD reference tables (data/fisd/*). This block governs
# the FISD-restricted universe definition, the rating letter→numeric ladder,
# and the as-of monthly rating construction. It is a PREPROCESSING-only step:
# it does NOT touch the monthly panel or the merge — those land in Phase 1.
# [VERIFY] the universe rules against Dickerson-Robotti-Rossetti "Common
# pitfalls" appendix / trace-data-pipeline before the Phase 1 merge is wired.
fisd:
  universe:
    # Currency: FISD leaves domestic-USD currency blank (~100% null on the
    # matched set), so null is treated as USD and allowed.
    currency_allow: ["USD"]
    allow_null_currency: true
    exclude_convertible: true     # convertible == 'Y' dropped
    exclude_asset_backed: true    # asset_backed == 'Y' dropped (structured/ABS)
    exclude_144a: true            # rule_144a == 'Y' dropped (DRR convention — VERIFY)
    exclude_perpetual: true       # perpetual == 'Y' dropped (no maturity → no TTM)
    # Coupon type: 'F' fixed, 'Z' zero-coupon kept; 'V' variable/floating dropped.
    # Keeping 'Z' is a flagged decision — confirm against DRR before the merge.
    coupon_type_allow: ["F", "Z"]
    # bond_type corporate keep-list. Excludes agency/government (USBN, FGOV),
    # preferred (PS, PSTK), and non-corporate codes by omission. VERIFY the
    # exact set against DRR; RNT/CCOV are borderline and flagged in the report.
    bond_type_keep: ["CDEB", "CMTN", "CMTZ", "CPAS", "CPIK", "UCID"]
  rating:
    # Agency codes in reference_fisd_ratings.rating_type: SPR=S&P, MR=Moody's,
    # FR=Fitch, DPR=DBRS.
    #
    # BBW/DRR convention (docs/quant/specs/BBW_anchor_implementation_spec.md §2.3): the monthly
    # numeric rating is the AVERAGE of the agencies in `average_agencies` when
    # more than one is available, with single-agency fallback when only one is.
    # Fitch (FR) and DBRS (DPR) are excluded by omission — BBW averages S&P and
    # Moody's only. This deliberately MATCHES BBW (2019 §3.3.2) rather than the
    # rejected first-non-null priority pick (audit trail in spec §2.3).
    #
    # Notch alignment: the `sp` and `moody` ladders below coincide notch-for-notch
    # 1..21 (AAA/Aaa=1 … C/C=21); only S&P's D=22 has no Moody's equivalent. The
    # naive average diverges from OSBAP `comp_rating` ONLY at single-agency
    # defaults (S&P-only D → 22, Moody's-only C → 21 here, vs comp_rating 21.5;
    # both-rated D/C coincides at 21.5). CONDITIONAL assertion: harmless because
    # the universe excludes defaults, so these rows never enter a sort — enforced
    # by the tripwire test_asof_bottom_notch_default_behavior. If the universe
    # ever admits defaults, reconcile against DRR's factor-construction appendix
    # (spec §11.1).
    average_agencies: ["SPR", "MR"]
    not_rated_tokens: ["NR"]              # NR → not-rated (null numeric)
    withdrawn_status: ["WOFF", "Off"]     # rating withdrawn → not-rated from that date
    date_min: "1980-01-01"               # rating_date hygiene: drop events before this
    ig_threshold: 10                      # numeric ≤ 10 (BBB-/Baa3) ⇒ investment grade
  rating_numeric_map:
    # Unified 1–22 ladder (AAA/Aaa=1 … D=22). S&P uses the 'sp' map, Moody's
    # uses 'moody'. (Fitch/DBRS are filtered out at load and never mapped — see
    # fisd.rating.average_agencies.) Source: standard 22-notch rating ladder.
    sp:
      "AAA": 1
      "AA+": 2
      "AA": 3
      "AA-": 4
      "A+": 5
      "A": 6
      "A-": 7
      "BBB+": 8
      "BBB": 9
      "BBB-": 10
      "BB+": 11
      "BB": 12
      "BB-": 13
      "B+": 14
      "B": 15
      "B-": 16
      "CCC+": 17
      "CCC": 18
      "CCC-": 19
      "CC": 20
      "C": 21
      "D": 22
    moody:
      "Aaa": 1
      "Aa1": 2
      "Aa2": 3
      "Aa3": 4
      "A1": 5
      "A2": 6
      "A3": 7
      "Baa1": 8
      "Baa2": 9
      "Baa3": 10
      "Ba1": 11
      "Ba2": 12
      "Ba3": 13
      "B1": 14
      "B2": 15
      "B3": 16
      "Caa1": 17
      "Caa2": 18
      "Caa3": 19
      "Ca": 20
      "C": 21
  amount_outstanding:
    # amount_outstanding in mergedissue is unreliable (median 0, some negative);
    # offering_amt is the static issuance-size proxy until a time-varying
    # reconstruction from FISD action events is built. Final VW choice is
    # deferred to the Phase 1 merge — this step only surfaces the evidence.
    size_proxy: "offering_amt"
  duration:
    # Carried for the future term/duration signal; duration recompute (from
    # maturity + coupon, never FISD/OSBAP md_dur) lands with the BBW signals.
    day_count_default: "30/360"
  survivorship:
    # exit_reason inputs. exit_reason records the EARLIEST of default_date,
    # defeased_date, maturity (matured | defaulted | defeased) — the full audit
    # label. default_date is the first rating event in default_tokens (FISD has
    # no default-date field; the rating ladder's default bucket dates it).
    default_tokens: ["D", "SD", "DD", "DDD"]
    # The survivorship TOGGLE (views.py) acts ONLY on these exit_reason values:
    # distress rows are dropped in the naive run and kept in the corrected run —
    # their difference is the survivorship gap. Maturity / defeased are recorded
    # but NOT toggled: they are performance-neutral, anticipated exits, kept in
    # BOTH runs so they cancel and add nothing to the gap. (Calls are undateable
    # in FISD, so never flagged — a documented limitation.)
    distress_exits: ["defaulted"]

# ---------------------------------------------------------------------------
# Librarian dual-model LLM stack (D33 amendment, 2026-07-13; stack values
# committed 2026-07-14 per docs/backlog/remaining_work.md L1/D4).
# Read at runtime by the RealModelClient (agents/librarian/pipeline/real_client.py)
# — model ids are NEVER hard-coded in agent code (inviolable rule).
# Two-phase policy (docs/evaluation/evaluation_contract_v1.md §1):
#   phase_d — free DEVELOPMENT pair; numbers are NON-reportable (calibration is
#             pair-specific). Two model families per the D9 independence rationale.
#   phase_f — REPORTED figures only; gated on per-corpus SKU + cost authorization
#             (D33) BEFORE any gold run. Claude Sonnet 4.6 + Gemini 3.5-flash.
# temperature 0 + structured (JSON-schema-constrained) decoding, per D9/D10/D33.
# api_key_env names the env var each client reads its key from — the key itself
# NEVER lives in the repo (.env is git-ignored; see .env.example).
# ---------------------------------------------------------------------------
librarian:
  model_stack:
    temperature: 0
    structured_decoding: true
    # Rate-limit knobs (RealModelClient): min seconds between calls + retry count.
    # Free tiers cap requests/sec AND tokens/min; per-model overrides below.
    min_interval_s: 1.0
    max_retries: 6
    phase_d:                       # free dev pair — non-reportable
      model_a:
        vendor: gemini
        # Free-dev SKU (probed 2026-07-18): 3.5-flash=20 req/day, 2.0-flash-lite=free-0,
        # 2.5-flash-lite=404; 3.1-flash-lite has a free daily budget -> pinned. Gemini
        # FAMILY per contract §1; SKU deviation = D33 amendment in decision-log. thinking=0.
        model_id: gemini-3.1-flash-lite
        api_key_env: GEMINI_API_KEY
        # 3.1-flash-lite free tier = 250k INPUT TOKENS/MIN; each full-paper call is
        # ~20-25k tokens, so pace to ~10 calls/min to stay under it (a full paper is
        # ~41 calls ⇒ ~4-5 min). Residual 429s recover via the body retryDelay.
        min_interval_s: 6.0
      model_b:
        vendor: mistral
        # EMPIRICALLY PINNED 2026-07-16: mistral-small-latest returns schema-valid JSON at
        # temp 0 (returned version mistral-small-latest) — a free-tier SKU, contract-
        # consistent ("Mistral free tier"). The WIP's mistral-large-latest is the PAID
        # flagship (corrected). D33 contingency: if a free SKU fails schema at temp 0,
        # swap the family (e.g. Qwen2.5-72B via DashScope) — the two-family structure survives.
        model_id: mistral-small-latest
        api_key_env: MISTRAL_API_KEY
        min_interval_s: 4.0          # free tier tokens/min is the binding cap
    phase_f:                       # reported figures — gated on SKU/cost authorization (D33)
      model_a:
        vendor: anthropic
        model_id: claude-sonnet-4-6    # "current snapshot" — pinned at authorization
        api_key_env: ANTHROPIC_API_KEY
      model_b:
        vendor: gemini
        model_id: gemini-3.5-flash   # 2.5-flash is new-user-restricted (404)
        api_key_env: GEMINI_API_KEY

  # --- G3 gold calibration (D34 mechanics, D37 conventions) -------------------
  # Read at runtime by the G3 harness; the harness HARD-RAISES if this block is
  # absent rather than defaulting (same discipline as load_verified_standing_subs
  # on the G2 side -- a calibration run against silently-defaulted thresholds is
  # a number nobody chose). Per the project rule these live here, never in agent code.
  g3:
    # D34: per-field-type cells at n >= 20, else the cell reports "uncalibrated".
    # D34's own reopen clause: if no cell reaches the bar, granularity is
    # coarsened and DECLARED -- never silently pooled. On a 3-anchor gold set
    # (136 comparable field observations) most cells are expected to sit below
    # this; that is the honest output, not an error state.
    min_cell_n: 20
    # Two-sided 95% Wilson interval. Wilson (not Wald) because the counts are
    # small and often at 0 or n, where Wald gives degenerate zero-width bounds.
    wilson_z: 1.959963984540054
    # Contract §3.3: field-level intervals are DESCRIPTIVE; the unit of
    # generalisation is the observed gold corpus, so no population-level claim.
    interval_label: descriptive

# ---------------------------------------------------------------------------
# Auditor (RQ3) pre-registration constants — docs/auditor/auditor_design.md v1.7.
# Read fail-loud by agents/auditor/thresholds.py (never defaulted in code, §13.2).
# PRE-REGISTERED: these are committed with ex-ante justification and git-tagged
# (auditor-prereg-2026-07-22) BEFORE any confirmatory run — the git tag + commit
# hash are the pre-registration evidence (§13.1). Units for the primary metric
# `average` are decimal monthly long-short return (0.001 = 0.1%/month = 10 bp/mo).
# ---------------------------------------------------------------------------
auditor:
  # Deflated-Sharpe pre-registration (O-A4, §9.1) — frozen 2026-08-11, the
  # values proposed in docs/auditor/confirmatory_prereg_proposal.md §1. Committing
  # this block clears run_full_audit's DsrPreRegistrationAbsent gate. n_trials is the
  # strategy-level discovery count (identical across the 2^k cells; NOT 2^k); sr_std
  # is the per-period (MONTHLY) cross-trial Sharpe SD.
  #   n_trials = 6 — the anchor screening family (BBW-4 [MKTB/DRF/CRF/LRF] + str + mom6);
  #     a conservative deflation reflecting the project's factor-selection breadth.
  #   sr_std = 0.08 — an EMPIRICAL development-sample calibration (literature monthly
  #     ~0.05-0.10), NOT an independently pre-registered constant.
  # DSR is REPORTED AS SENSITIVITY across n_trials {1, 6, 108}, and is NEVER a
  # pass/fail anchor-validation gate (spec v4 Part F). The run also records the
  # realised cross-anchor monthly-Sharpe SD as a cross-check.
  dsr:
    str:  {n_trials: 6, sr_std: 0.08}
    drf:  {n_trials: 6, sr_std: 0.08}
    mom6: {n_trials: 6, sr_std: 0.08}
  # The primary metric drives the confirmatory family, the DOE decomposition, the
  # Bayesian/hierarchical estimands and the inference routing (§9.1). `average`
  # (mean monthly long-short return) is a mean of observables, so the exact HAC
  # branch applies (§7.1); Sharpe is still reported per-cell as secondary.
  primary_metric: average
  support_gate:
    # §4.2 minimum common-support gate. 60 months (5y) is a conventional floor for
    # stable factor moments; the development window (2002-2021, ~240 months) far
    # exceeds it, so the gate binds only under heavy stale/survivorship intersection.
    min_common_months: 60
    # Keep >= 50% of the longest cell's native sample; below this the intersection
    # loss is itself the finding (§4.2), not a usable common support.
    min_common_fraction_of_reference: 0.5
  bootstrap:
    # §14 normative replicate count (the first conditional cut is 500, never the
    # lattice or the injection calibration).
    n_replicates: 1000
    # §6.2 B_min: at least 10 non-overlapping blocks for a usable block bootstrap.
    min_effective_blocks: 10
    # §6.2 l_data_driven: the pre-committed block length; the realised block is
    # l = max(H_max, 6). 6 aligns with the longest anchor holding horizon (mom6
    # H=6) and captures monthly-return serial dependence.
    block_length_months: 6
    # SC-SCI-13 (2026-08-07): LABELLED-DIAGNOSTIC block lengths for the holdout
    # inference sensitivity CI (shared/stats/holdout_bootstrap.py). Never confirmatory —
    # supersedes A7's "no holdout bootstrap intervals" for this narrow use only (amendments
    # index A8). Reuses n_replicates(1000) + min_effective_blocks(10) above; only the length
    # pair is new. Effective blocks are DISCLOSED, not satisfied: 45/{3,6}=15/7, 36/{3,6}=12/6,
    # labelled floor_met/below_floor vs the 10-block floor (a length is never picked to clear it).
    holdout_diagnostic_block_lengths_months: [3, 6]
  shapley:
    # §5.3 percentage-denominator guard: shares (phi_i / Delta) are emitted only
    # when |Delta_correction| > 0.1%/month; below that the ratio is a division
    # artefact (and the endpoint gap is economically negligible anyway).
    percentage_denominator_min: 0.001
  practical_significance:
    # §9 / §8.2.3 -- vartheta is load-bearing TWICE (economic classification AND
    # material-effect prevalence). 10 bp/month sits below the smallest documented
    # DRR implementation bias (measurement error ~15-90 bp/month), so a bias must
    # clear the smallest known effect to count as "material" -- a conservative,
    # ex-ante floor, not chosen from any result.
    vartheta: 0.001
  compression:
    # §8.1 D_max: main + confirmatory two-way effects must carry >= 90% of total
    # effect energy; > 10% in third-and-higher order means the bias structure is
    # irreducibly higher-order (a finding, promoting the appendix coefficients).
    d_max: 0.10
  fdr:
    # §7.2 Benjamini-Hochberg level for the confirmatory family (5 first-order
    # effects + 3 validated interaction pairs x locked anchors).
    q: 0.10
  bayes:
    # §7.4 weakly-informative primary prior N(0, prior_scale^2) on the DOE effects.
    # 0.02 is broad relative to the plausible bias range (DRR effects <= ~1%/month)
    # and is deliberately NOT the anchor's expected value (that would make agreement
    # with DRR self-fulfilling). The DRR-informed prior is sensitivity-only.
    prior_scale: 0.02
    # §7.3.3 eigenvalue floor for V_boot regularisation -- a numerical PD floor,
    # small enough not to distort a well-conditioned bootstrap covariance.
    epsilon: 1.0e-10
  economic:
    # §9 practical-significance bands, applied to the ANNUALISED endpoint gap
    # (corrected - as-published). A correction worth > 5%/year of annual return is
    # a Large economic effect for a practitioner.
    gap_bands:
      small: 0.005      # 0.5%/year
      moderate: 0.02    # 2%/year
      large: 0.05       # 5%/year
  # Step-19 LLM explainer prose. Runs strictly AFTER the deterministic verdict with
  # ZERO gating power (§11); every numeric token is checked against the typed report
  # by numeric_verifier, falling back to the deterministic renderer on any mismatch.
  # Two-phase like librarian.model_stack: phase_d is the free DEV pair (prose is
  # non-reportable), phase_f is the REPORTED model. Single model per phase (the
  # verifier is the gate, so no dual-model merge is needed).
  explainer:
    temperature: 0
    max_output_tokens: 1024
    max_retries: 3
    phase_d:                          # free DEV -- non-reportable prose
      vendor: gemini
      model_id: gemini-3.1-flash-lite
      api_key_env: GEMINI_API_KEY
      min_interval_s: 6.0
    phase_f:                          # REPORTED / testing prose
      vendor: anthropic
      model_id: claude-sonnet-4-6
      api_key_env: ANTHROPIC_API_KEY
      min_interval_s: 1.0

  # =========================================================================
  # Frozen-Loadings IPCA Differential — exploratory stretch (RQ3 extension).
  # Spec: docs/auditor/evaluation_frozen_ipca_differential_v5_FINAL.md (v5), §9.
  # Loaders: agents/auditor/thresholds.py::load_ipca_lambda / _projection_gate /
  #          _reporting / _execution_config (all fail-loud).
  #
  # STATUS DISCIPLINE: every §9 constant (items 1-11, incl. bootstrap/FPR/stability/
  # perturbation) is now registered. `status` is `preregistered_complete` as of the
  # Registration commit (git-tagged) — the pre-registration FREEZE before any
  # real-data cell exists. load_ipca_execution_config LOADS every block (not just checks
  # keys), so a malformed block still fails the gate. The `execution` sub-block below records
  # the amended pair set (9 runnable + 6 typed-refused) and the signal-propagation branch rule;
  # narrative pre-registration: docs/auditor/ipca_differential_execution_preregistration.md.
  # =========================================================================
  ipca_differential:
    status: preregistered_complete

    # -- λ, category-4 registered constants (mirror kpp_ipca.yaml / ipca_instruments.yaml,
    #    re-registered here as the extension's own pre-registration).
    lambda:
      factor_count: 5                 # K [kpp_ipca.yaml:model.K; PAPER §III]
      k_sensitivity: [4, 6]           # §9.5 K±1 sensitivity
      instrument_count: 8             # L = 7 instruments + constant [ipca_instruments.yaml:meta.L]
      characteristic_order:           # the L-1 instrument names, in order (constant appended last)
        - str_reversal
        - mom6
        - var_5pct
        - gamma_illiq
        - rating
        - time_to_maturity
        - bond_vol
      als_tolerance: 1.0e-4           # [kpp_ipca.yaml:estimation.tolerance]
      als_max_iter: 1000              # [kpp_ipca.yaml:estimation.max_iter_in_sample]
      month_weighting: per_month_normalized   # K22 arm [kpp_ipca.yaml]
      scaling_lane: VOLScaled010      # [ipca_instruments.yaml:meta.scaling_lane]
      vol_floor: 0.01                 # [kpp_ipca.yaml:scaling.vol_floor]
      normalisation_rule: kpp_r2_qr_descending_moment_meanpos   # ipca._identify (R2 adjudication)
      # production estimator rule (§5.2). Single SVD init until the §12.5 fit-timing
      # measurement decides best-of-M; then n_initialisations grows with NO call-site change.
      n_initialisations: 1
      initialisation_seeds: [20260612]        # [kpp_ipca.yaml:bootstrap.seed lineage]
      tie_break: lowest_objective_then_seed

    # -- Projection identifiability gate (§6.4). Gated on B_t = Z_t Γ directly.
    projection_gate:
      min_cross_section_n: 8          # N_m must exceed this (and L) for a usable month
      require_rank: 5                 # = K; rank(B_t) must equal K
      max_condition_number: 1.0e+10   # cond(B_t) ceiling; above ⇒ month is unidentified
      pseudoinverse_permitted: false  # a silent pinv with arbitrary tol is an undisclosed DoF
      pseudoinverse_tolerance: null   # unused while pseudoinverse_permitted is false
      max_failed_month_fraction: 0.10 # > this fraction of failed months ⇒ cell refusal
      failed_month_handling: exclude  # exclude | cell_refusal

    # -- Reporting set + emphasis (§3.2). No aggregate, no GRS; the count is frozen.
    reporting:
      n_pairs: 15                     # 5 biases × 3 anchors
      anchors: [str, mom6, drf]
      # Pre-specified focal pairs ONLY where the expectation register documents a
      # mechanism. survivorship / stale_price carry co-equal cross-tests by declared
      # absence — manufacturing a focal pair now would be the very researcher DoF the
      # project exposes. The word "primary" is banned inside the extension.
      focal_pairs:
        lib_gap: str
        lab_trim: mom6
        meas_err: drf
      no_focal_pair: [survivorship, stale_price]
      # §3.1 / §9.11 chimera exemption: pricing the corrected fixed anchor against a
      # dirty-panel factor set is an evaluation OVERLAY, not a construction chimera.
      # Scoped to the IPCA differential evaluation layer; the construction guard stays armed.
      benchmark_overlay_exemption: true

    # -- Conditional inference (§5.3). Synchronised moving-block bootstrap over
    #    the regression sample (months): fixed blocks, ℓ = max(H_max, block_length_months), ONE
    #    common block sequence across all four cells so contrasts are comonotone. CONDITIONAL on
    #    the realised fitted states — the recovered factor series are held fixed (no re-fit), so
    #    only the month subset varies. Re-fitting uncertainty is NOT estimated (§5.3).
    bootstrap:
      n_replicates: 1000              # §14 normative count (mirrors the core auditor)
      block_length_months: 6          # ℓ_data; realised ℓ = max(H_max, 6) [aligns with mom6]
      min_effective_blocks: 10        # B_min: >= 10 non-overlapping blocks or REFUSE
      holding_period_default: 1       # H_max for a monthly-rebalanced anchor long-short
      alpha: 0.05                     # 95% two-sided percentile interval
      conditioning_label: "conditional on the realised fitted states (Theta_N, Theta_b); re-fitting uncertainty not estimated"

    # -- Stability diagnostic (§5.4). R' outer refits on blocked resamples of the
    #    REAL panel — SAME block scheme as §5.3 (one resampling universe), each refit under the
    #    production rule §5.2 — reporting whether the SIGN and ORDER OF MAGNITUDE of I survive
    #    refitting. Field coupling_stability_diagnostic; NEVER an interval; pre-registered so it
    #    cannot become a post-hoc rescue. Scope = all five biases (pre-registered).
    stability_diagnostic:
      r_prime: 25                     # 20-30 outer refits (compute-contingent)
      block_length_months: 6          # same scheme as §5.3
      min_effective_blocks: 10
      holding_period_default: 1
      order_of_magnitude_factor: 10.0 # |I_r| "survives" if within [1/f, f] * |I_obs|
      scope: [meas_err, stale_price, survivorship, lib_gap, lab_trim]

    # -- Randomisation-based FPR (§6.2). The mean-zero-noise "placebo" is WITHDRAWN as a
    #    null (E[ε]=0 does not give E[I]=0 through a nonlinear fitted model — the mean-zero fallacy the
    #    project's own EIV mechanism refutes). The valid instrument is EXCHANGEABILITY: a matched-twin
    #    DGP (each bond has two i.i.d. idiosyncratic draws sharing one characteristic path + loadings),
    #    a placebo swap operator (which twin an arm sees is exchangeable by construction), label
    #    re-randomisation Q times under the production rule §5.2, a randomisation p-value, and
    #    FPR_hat over R independently generated datasets judged against a binomial acceptance band.
    #    Synthetic-scale (~R(1+Q)M fits). If infeasible: the reduced-(Q,R) fallback; if even that is
    #    infeasible, the pre-committed RENAME ("stochastic null-invariance calibration"), never "FPR".
    randomisation_fpr:
      q_permutations: 49              # Q — label re-randomisations per dataset
      r_datasets: 50                  # R — independently generated datasets
      alpha_nominal: 0.05             # α_nom — the nominal test level FPR_hat is judged against
      acceptance_band_level: 0.95     # binomial acceptance band coverage for FPR_hat
      twin_dgp:                       # synthetic-scale matched-twin generator
        n_bonds: 40
        n_months: 72
        noise_sd: 0.02
      reduced_q: 19                   # reduced-(Q,R) fallback, gated on synthetic fit timing
      reduced_r: 20
      rename_fallback_label: "stochastic null-invariance calibration"

    # -- Stochastic perturbation robustness (§6.3). The mean-zero-noise run RETAINED
    #    under its HONEST name: the distribution of I under symmetric perturbation, reported as a
    #    robustness descriptive with a systematic non-null centre EXPECTED and interpreted as the
    #    variance/attenuation channel — NEVER called a false positive (is_fpr=False).
    perturbation_robustness:
      n_draws: 200
      noise_sd: 0.02

    # -- Execution pre-registration (§12.7). Amended pair set + the signal-propagation
    #    branch rule, frozen and git-tagged BEFORE any real-data cell exists (including the smoke's).
    #    Narrative: docs/auditor/ipca_differential_execution_preregistration.md.
    execution:
      # The 15 estimand TYPES split into 9 runnable + 6 typed-refused. The refusal is condition-2
      # discipline (D-A50): no published IPCA implementation of the construction-layer toggles exists,
      # so their as-published (OFF) state is UNDEFINED — not defaultable. Defaulting it would
      # manufacture the differential, the exact researcher DoF the project exposes.
      runnable_biases: [meas_err, stale_price, survivorship]   # panel_view biases
      runnable_anchors: [str, mom6, drf]                       # 3 × 3 = 9 runnable pairs
      refused:
        biases: [lib_gap, lab_trim]
        anchors: [str, mom6, drf]                              # 2 × 3 = 6 refused pairs
        reason: FEED_OFF_STATE_UNDEFINED
        note: >
          No published IPCA implementation exists to define the as-published state of
          construction-layer toggles for the characteristic feed. A future REGISTERED mapping
          may unlock a subset (lab_trim where the paper's trim rule is bond-level); named as
          not implemented here.
      # One focal pair survives the refusal: meas_err→drf (the strongest for the laundering
      # hypothesis — EIV attenuation is the canonical channel by which estimation reacts to noisy
      # data). The §3.2 emphasis rules apply unchanged to a 1-focal + 8-cross-test 3×3 matrix.
      smoke_pair: [meas_err, drf]
      # Signal propagation for stale_price / survivorship (decision b). Recompute per
      # panel state is PRIMARY, gated by a <=half-day spike; the fallback is the renamed passthrough
      # (never bare). Decided by MEASUREMENT (the spike), not preference — the escape-hatch discipline.
      signal_propagation:
        primary: recompute_per_panel_state
        spike_timebox_hours: 4
        fallback: frozen_at_pn_partial_channel_renamed   # [ret+mem] variants + inventory exception
      # Smoke is engineering-only: a surprising alpha SHIPS; only a DEFECT triggers fix-document-rerun
      # (no silent iteration). Full criteria in the pre-registration doc.
      smoke_is_engineering_only: true

# ---------------------------------------------------------------------------
# crowding — Layer-1 crowding survivor diagnostic (shared/evaluation/crowding.py).
#
# PRE-REGISTRATION DEVIATION (D6): the crowding factor set was specified as
# BBW-4 + KPP-5 (docs/archive/kpp5_spec.md, now SUPERSEDED). KPP-5 is unbuildable on this
# TRACE/FISD panel — only bond volatility exists; duration is a maturity proxy
# (time_to_maturity); credit spread and spread-to-distance-to-default have NO data.
# Layer 1 replaces the KPP non-market characteristics with the project's own
# corrected short-term-reversal (str) and 6-month-momentum (mom6) factors: a fixed
# 6-factor set, identical for every candidate (no leave-one-parent-out). Layer 2
# (recursive-OOS IPCA factor spanning) is deferred — see docs/backlog/remaining_work.md.
#
# LIMITATION (L13): the credit-spread and value (spread-to-distance-to-default)
# dimensions stay untested by Layer 1 because they are absent from the panel — a
# data limitation inherited from the IPCA/panel workstream, not created here.
# ---------------------------------------------------------------------------
crowding:
  # Fixed logical factor set; corrected lattice only. Regressed unconditionally.
  factor_set: [mktb, drf, crf, lrf, str, mom6]
  # HAC lag rule. floor_t_pow_0.25 = floor(T**0.25), the SAME rule the primary
  # alpha-vs-BBW-4 test is pre-registered on, so crowding alpha and primary alpha
  # share one convention. newey_west_auto (the characteristic-sort engine's native
  # floor(4*(T/100)^(2/9))) is the only other accepted value.
  hac_lag_rule: floor_t_pow_0.25
  # Minimum candidate/factor overlap (months) below which the diagnostic sets
  # below_min_obs=1.0 rather than silently trusting NW-HAC t-stats on a short
  # sample. 60 = five years; a pre-registered floor for NW-HAC stability (a short
  # overlap gives an unreliable HAC t-stat), chosen ex ante from sample length
  # alone — never from factor performance. CONFIRMED 2026-08-03.
  min_obs: 60
  # Corrected-column sources: one (path, column) per logical factor. Only these
  # _corr columns are ever read — never a *_raw / n_bonds column.
  bundles:
    mktb: {path: data/development/factors/mktb.parquet,        column: mktb_corr}
    drf:  {path: data/development/factors/bbw_factors.parquet, column: drf_corr}
    crf:  {path: data/development/factors/bbw_factors.parquet, column: crf_corr}
    lrf:  {path: data/development/factors/bbw_factors.parquet, column: lrf_corr}
    str:  {path: data/development/factors/str.parquet,         column: str_corr}
    mom6: {path: data/development/factors/mom6.parquet,        column: mom6_corr}

# ---------------------------------------------------------------------------
# Scientist (RQ4) — post-correction extension survival. The ENTRY rule lives here and
# REFERENCES the auditor block (R3, stated once); the full generation/evaluation protocol
# (m, seeds, CPCV, DSR, costs, selection, holdout) is committed separately in
# docs/scientist_protocol.yaml and git-tagged `scientist-prereg`. Never edit the auditor block.
# Design source: docs/scientist/scientist_spec_v1.md.
# ---------------------------------------------------------------------------
scientist:
  entry_rule:
    # R3 — a toggle is FAIL (correction-sensitive) iff bh_adjusted_p <= q AND |effect| > theta
    # AND effect_signed < 0 (performance-reducing). theta and q are STATED ONCE in the auditor
    # block and REFERENCED here (never restated), so RQ3's estimand and RQ4's entry criterion
    # cannot silently drift apart. Resolved by shared/handoff/scientist_case.load_entry_rule_params.
    materiality_threshold_ref: auditor.practical_significance.vartheta   # theta = 0.001
    fdr_q_ref: auditor.fdr.q                                             # q = 0.10
    # Diagnostic tier the effect must clear: within-strategy BH-adjusted p (the multiplicity
    # that actually exists — 5 first-order toggle effects per strategy; an existing Auditor
    # object). Documentation only; the loader reads theta/q, the seam applies the tier.
    tier: within_strategy_bh_adjusted_p
  # The generation/evaluation protocol is committed separately (see header).
  protocol_ref: docs/scientist_protocol.yaml
  # Rung-3 (llm_researcher) generative model wiring (SC-SCI-9). SKUs MIRROR
  # librarian.model_stack.phase_d (D4 phase_d — the free DEV pair, NON-reportable). Read fail-loud
  # by agents/scientist/researcher/phase_d_client.load_model_stack. Reportable generative figures
  # require phase_f (Sonnet 4.6 + Gemini 3.5-flash) + SKU/cost authorization — see the librarian block.
  model_stack:
    temperature: 0.7               # >0 so the k-seed generation-quality arm has genuine seed-to-seed
                                   #   diversity; each response is frozen by the seed-keyed
                                   #   ResponseCache (R5) -> reproducibility is by REPLAY, not vendor
                                   #   determinism. TUNABLE — flag for review (0 = deterministic
                                   #   but identical across seeds until a vendor seed is threaded).
    max_output_tokens: 2048        # m compact JSON proposals per call
    max_retries: 6
    phase_d:                       # free DEV pair — NON-reportable (D4/D33)
      model_a:
        vendor: gemini
        model_id: gemini-3.1-flash-lite
        api_key_env: GEMINI_API_KEY
        min_interval_s: 6.0        # 3.1-flash-lite free tier = 250k input tokens/min
      model_b:
        vendor: mistral
        model_id: mistral-small-latest
        api_key_env: MISTRAL_API_KEY
        min_interval_s: 4.0        # free-tier tokens/min is the binding cap

# ---------------------------------------------------------------------------
# reporter — the deterministic Reporter agent (docs/reporter/reporter_spec_v0.2.md §7).
# ADDITIVE 13th top-level block. No existing loader enumerates top-level keys, and the
# frozen auditor / IPCA config hashes are computed over their OWN sub-blocks (["auditor"] and
# ["auditor"]["ipca_differential"]), so this sibling key is invisible to them (verified). The
# Reporter states no constant another agent already owns: the structural constants below are
# REFERENCES resolved (R3-style) against the sibling blocks by
# agents/reporter/thresholds.load_reporter_params. The one Reporter-owned literal is
# verify.rel_tol, passed to agents/auditor/explainer/numeric_verifier.verify_numbers.
# ---------------------------------------------------------------------------
reporter:
  schema_version: 1
  verify:
    rel_tol: 1.0e-9                # matches numeric_verifier.verify_numbers' own default
  structural_constants:            # dotted references, never restated (R3)
    momentum_horizon_ref: signals.mom6.formation_months                # m = 6
    fdr_q_ref: auditor.fdr.q                                           # q = 0.10
    bootstrap_replicates_ref: auditor.bootstrap.n_replicates           # B = 1000
    materiality_threshold_ref: auditor.practical_significance.vartheta  # theta = 0.001

# ---------------------------------------------------------------------------
# shared_evaluation — cost + regime constants for the shared economic diagnostics
# (shared/evaluation, spec §6/§7; supersedes the Devil's Advocate agent, D4).
# ADDITIVE 14th top-level block. Additive sibling, invisible to the existing loaders
# (the same pattern the reporter: block established): no loader enumerates top-level
# keys, and the frozen auditor / IPCA config hashes are computed over their OWN
# sub-blocks, so this sibling key is invisible to them. The SPANNING constants stay in
# the `crowding:` block (untouched); this block adds only the cost scenarios and the
# regime evaluation/contrast constants. Read fail-loud by
# shared/evaluation/thresholds.load_costs_config / load_regimes_config.
# ---------------------------------------------------------------------------
shared_evaluation:
  costs:
    # Cost-scenario registry (D-E12): each entry carries a source + unit. A scenario
    # whose source is the UNRESOLVED sentinel is loaded as usable=false and is NEVER
    # emitted as a cost figure until a real citation lands (P5). The conclusion stops
    # depending on the input we are least confident in — a reader who disagrees with
    # 40/80 can read the break-even and the KPP-comparable column.
    scenarios:
      kpp_comparable:
        ig_bps: 19
        hy_bps: 19
        unit: one_way          # KPP states one-way 19 bp on all trades
        source: "KPP (2023) 19 bp one-way on all trades [PAPER p.1989-90; docs/quant/specs/ipca_spec.md:113]"
      project_registered:
        ig_bps: 40
        hy_bps: 80
        unit: round_trip       # per spec §3.2.5 — BUT unit unverified (JNPS convention, P5)
        source: UNRESOLVED_pending_citation   # BLOCKED ON P5 — docs/domain_facts.md does not exist
    break_even:
      # Alpha break-even denominator is the CONTROL-ADJUSTED turnover intercept, never
      # unconditional mean turnover (D-E13): c_BE^alpha = alpha_hat_r / alpha_hat_TO.
      alpha_denominator: control_adjusted_turnover_intercept
      # Fallback grid of assumed CONSTANT monthly turnover rates (fraction traded /
      # month), used only when no measured turnover series exists (P4 unresolved). The
      # closed form gives the crossing point at each grid point at no extra code.
      assumed_turnover_grid: [0.05, 0.10, 0.20, 0.30, 0.50]
    # Long-short gross-exposure convention (1 = per leg, 2 = both legs summed).
    gross_exposure_convention: 2
  regimes:
    # Evaluation regime = FROZEN development median, RESOLVED (never restated) from the
    # committed extension_1 median (D-E14). Formation regime (expanding strictly
    # past-only median) is DEFERRED behind amendment A3 + precondition P2.
    macro_data_contract_id: baa_aaa_v1
    # Minimum months a state must INDEPENDENTLY clear for the SUPPLEMENTARY
    # conditional-alpha field to be populated (D-E16). 60 = the spanning NW-HAC floor;
    # on development both states clear it, on the 36-45mo holdout neither does.
    min_obs_conditional: 60
    evaluation_median_source:
      file: docs/extension_1_config.yaml
      key: median_split.median_baa_aaa_spread_pp   # = 0.935, computed on development only

# ---------------------------------------------------------------------------
# P4 optimisation-overfitting grids (extensions WS-D; EXPLORATORY).
# APPROVED 2026-08-06 (E4), the D0 mom6 lag resolution having been recorded
# in docs/extensions/contracts/p4_optimisation_protocol.md. Grids are stored
# as OFFSETS/LEVELS only; centres are resolved AT RUNTIME from the signals:
# block above (the machine-readable published values the oracle builders
# consume) and cross-checked against the gold-typed fields that exist.
# Optimised parameters are never promoted to recommendations.
# ---------------------------------------------------------------------------
p4_grids:
  execution_gate_file: docs/p4_execution_gate.yaml
  max_cells_per_module: 200
  mom6:
    formation_months: {offsets: [-3, 0, 3, 6]}   # centre signals.mom6.formation_months=6 -> {3,6,9,12}
    # D0: the swept "skip" IS the engine signal_lag = the lib_gap bias toggle
    # (uncorrected 0 / corrected 1). Lag 0 at the corrected corner would
    # REINTRODUCE the enumerated look-ahead, so the grid sweeps the TOTAL
    # signal-to-trade gap with the corrected floor: {1, 2}, centre = published
    # skip = corrected value = 1.
    total_signal_gap_months: {levels: [1, 2]}
    min_obs_rule: equals_formation               # published: all formation months present
  str:
    # APPROVED 2026-08-06 (E4, over the refusal): str's published design has
    # NO window parameter (the reversal signal is structurally the prior-month
    # excess return). This dial is CONSTRUCTED — its sweep is a
    # family-robustness measurement, categorically distinct from the mom6/drf
    # published-vs-optimised premium and reported separately under that label.
    # k-month trailing cumulative xret via the audited compute_mom6_signal.
    reversal_window_months: {levels: [1, 2, 3]}  # centre = published 1-month prior return
  drf:
    window: {offsets: [-12, -6, 0, 6, 12]}       # centre signals.var_5pct.window=36 -> {24,30,36,42,48}
    min_obs: {offsets: [-6, 0, 6]}               # centre signals.var_5pct.min_obs=24 -> {18,24,30}
    # APPROVED 2026-08-06 (E4), decided by INVARIANCE: ceil(0.05 x 36) = 2, so
    # the published centre is reproduced exactly while the swept object stays
    # "estimation window for a fixed 5% VaR" rather than a window/quantile
    # confound. fixed_2 remains the recorded alternative estimand.
    rank_rule: ceil_5pct_of_window

# ---------------------------------------------------------------------------
# P1 codegen-ablation scoring + sandbox (extensions WS-C). APPROVED
# 2026-08-06 (E3), conditional on the raw-metrics table in the report
# template (condition met); mirrored in the frozen mini-contract
# docs/extensions/contracts/p1_codegen_ablation.md. Metric-specific ABSOLUTE
# tolerances per evaluation contract §7.4 (no universal relative tolerance).
# The RUNS_WRONG rate is a function of these thresholds, so the ablation
# report always publishes the raw per-run similarity metrics table alongside
# the verdicts (re-thresholdable by any reader).
# ---------------------------------------------------------------------------
p1_codegen:
  scoring:
    min_overlap_months: 24        # below -> RUNS_WRONG(insufficient_overlap)
    correlation_min: 0.99
    sign_agreement_min: 0.95
    mean_abs_diff_max: 0.0005     # 5 bp/mo, absolute mean monthly difference
    tracking_error_max: 0.001     # 10 bp/mo, sd of the monthly difference
    exact_tier_max_abs_diff: 1.0e-8
  sandbox:
    wall_clock_seconds: 600
    memory_mb: 8192

# ---------------------------------------------------------------------------
# Scale-layer / corpus-growth SELECTION RULE (frozen before candidate papers are
# examined). Narrative spec: docs/evaluation/t2_selection_prereg.md; inventory:
# docs/evaluation/corpus_inventory.md. Pre-registers the resolution of
# data-FINAL-log open item O1 (RQ2 coverage / external reference, NOT RQ3
# prevalence). Consistency-
# guarded by tests/unit/test_t2_selection_prereg.py. The git tag
# `t2-selection-prereg` was applied when `status` reached 'frozen';
# a rule's whole force is that it precedes the candidate papers.
#
# `status` gates the freeze exactly like auditor.ipca_differential.status: while
# 'draft_pending_review', the TO_SET fields are PROPOSALS, not
# commitments, and the rule must NOT be cited as pre-registered. It is flipped
# to 'frozen' (and tagged) only once every TO_SET value is chosen.
# ---------------------------------------------------------------------------
corpus:
  selection:
    status: draft_pending_review       # -> 'frozen' on review + tag
    # T2 = the extraction subset (StrategySpec extraction gold; RQ1 generalisation).
    # Target 3 unseen papers; drops to 2 if the human gold-authoring budget binds.
    t2_target_count: 3
    t2_min_count: 2
    # Admission constraints (TO_SET — the values, once committed, give
    # the rule its force; proposed defaults are in the narrative spec §3).
    source_venue_constraint: TO_SET     # proposed: peer-reviewed finance journal OR arXiv q-fin
    strategy_type_constraint: TO_SET    # proposed: cross-sectional sort OR fitted latent-factor model
    source_date_window_from: TO_SET     # proposed: 2013-01 (not older than the earliest anchor, JNPS 2013)
    source_date_window_to: TO_SET       # proposed: 2026-12 (through the project data ceiling)
    tie_break: TO_SET                    # proposed: earliest publication, then alphabetical first-author surname
    # Papers TOUCHED during design are INELIGIBLE. Append-only. At minimum every
    # paper with a frozen canonical text (evaluation/canonical_texts/*.frozen.yaml)
    # must appear here — enforced by the consistency test.
    design_touched_exclusions:
      - bbw_2019        # anchors drf/crf/lrf
      - bbw_2021        # frozen for corpus scaling (2026-08-17)
      - drr_2026        # anchor str; DRR-documented mom6 look-ahead + drf measurement error
      - jnps_2013       # anchor mom6
      - kpp_2023        # fitted-model anchor
      - bpw_2011        # gamma-illiquidity mechanism source
      - dfps_2026       # DFPS-4 secondary benchmark (SC-SCI-5)
      - dmr_2023        # DRR-documented drf/mom6 error source (DMR 2023)
      - gkx_2022        # mechanism-library source (GKX survey)
      - dg_2025         # DNN showcase / mechanism-library source (Duraj-Giesecke)
    # Downstream artefact depth by layer (project decision).
    t2_gold_depth: extraction_only            # StrategySpec extraction gold; downstream observed/profiled, not oracle-graded
    scale_gold_depth: enumeration_only        # paper-only NO-MODEL-CONSULT factor list (RQ2 coverage)
    gold_authoring: human_no_model_consult    # no automated agent authors any gold (2026-08-17 corpus-scaling decision)
    rq3_eligible: false                        # scale/T2 strategies NEVER enter the RQ3 census (D-A59)

# ---------------------------------------------------------------------------
# P2 coverage-boundary experiment (Workstream C) — the credential-independent
# BUILD of the agreement-at-scale study the P1 mini-contract §7 sequenced.
# Estimand: inter-model AGREEMENT rates + divergence magnitudes + a failure
# taxonomy — NEVER Sharpes-as-performance (no oracle exists to separate "strategy
# fails to replicate" from "code is wrong"; the §6 caveat is binding). Read
# fail-loud by evaluation/codegen/p2_metrics.py::load_p2_scoring_thresholds
# (a silent default would move the agreement/divergence boundary). Numbers are
# emitted only once the scale census EXISTS and corpus.selection.status=='frozen'
# until the scale census exists, --dry-run only.
# Contract: docs/extensions/contracts/p1_codegen_ablation.md §11 (v1.3).
# ---------------------------------------------------------------------------
p2_codegen:
  arms:
    arm_b_max: 5                      # Arm B = first min(|Arm A|, 5) compilable members
    below_floor_min_arm_a: 5          # |Arm A| < 5 -> suppress agreement/divergence (below-floor rule)
  agreement:
    correlation_min: 0.99             # a pair "agrees" iff corr >= this AND sign agreement below
    sign_agreement_min: 0.95
  divergence_strata:                  # labelled by DIVERGENCE magnitude (high divergence = low corr)
    high_divergence_corr_lt: 0.90     # high  divergence: corr < 0.90
    medium_divergence_corr_lt: 0.99   # medium divergence: 0.90 <= corr < 0.99 (low: corr >= 0.99)
  taxonomy_sampling:
    strata: [arm, divergence_magnitude]   # pre-registered failure-sampler strata (arm × magnitude)
  zoo_list:
    frozen_sha256: TO_SET       # sha256 of the frozen scale zoo-list; set + tagged at freeze
  min_overlap_months: 24             # below -> the pair's overlap is insufficient (agreement not scored)
