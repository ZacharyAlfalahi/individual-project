# All numerical thresholds for the pipeline.
# Auditor reads this at runtime — nothing is hard-coded in agent code.
# Every entry must carry a source citation.

trace_cleaning:
  # Dick-Nielsen (2009) "How to Clean Enhanced TRACE Data", p.528
  # price_floor raised from 0.0 to 1.0 to exclude near-zero prices (e.g. 1e-6)
  # that pass a strict >0 check but produce return blow-ups when present as a
  # VWAP denominator. Validated against OSBAP expected mean (~0.6%/month);
  # the ultra-distressed filter in OSBAP achieves the same effect.
  price_floor: 1.0
  price_ceiling: 300.0
  # Project design decision — committed before first run, never changed.
  # Holdout window is the closed interval [holdout_start_year, holdout_end_year]
  # = 2022–2025 (the 2026-06-09 WRDS re-pull runs into 2025). holdout_end_year
  # is an EXPLICIT upper bound: preprocess_trace.py raises if a future re-pull
  # carries rows beyond it, so the window cannot silently creep — extending it
  # must be a conscious edit here (and in the docs).
  holdout_start_year: 2022
  holdout_end_year: 2025
  # Dick-Nielsen (2009) Table 1 Panel B: keep only blank asof_cd.
  # Drops A (late report), R (reversal), D (delayed), X (cancellation).
  # Keeping "A" risks double-counting trades reported as corrections of earlier submissions.
  # NOTE: blank asof_cd in the CSV is read as NaN by pandas — the filter uses
  #   isna() | (== asof_cd_keep). The equality check alone would silently drop
  #   all on-time trades; both clauses are required.
  asof_cd_keep: ""
  # Dick-Nielsen (2009) p.528: prices above 30,000 cannot be corrected back into
  # the valid range (0, price_ceiling] by any ÷10 or ÷100 shift and are unrecoverable.
  # This is the wide pre-correction gate applied before the decimal-shift step.
  pre_correction_ceiling: 30000.0
  # Pre-2012 TRACE Enhanced universe has ~150 highly liquid benchmark bonds only.
  # 2012+: ~3,500 bonds. sub_prdct is NULL for all pre-2012 records (field added 2012).
  # Development window (2002-2021) includes both regimes; Quant agent filters sub_prdct as needed.
  universe_note: "pre-2012 sparse (~150 bonds); 2012+ broad (~3500 bonds); sub_prdct NULL pre-2012"

monthly_panel:
  # Keep straight corporate bonds + pre-2012 records (NULL sub_prdct). Drop CHRC and ELN.
  sub_prdct_keep:
    - "CORP"
    - ""
  # Institutional-size filter: drop trades below this par value threshold (Bai, Bali, Wen 2019)
  min_vol_qt: 100000
  # Bonds with no trades in a month get NaN return (never impute)
  min_trades_per_month: 1
  # Volume-weighted average price within month as end-of-month price
  price_agg_method: "vwap"
  # FRED TB3MS series: 3-month T-bill rate (annualised %) used as risk-free rate
  # Public endpoint — no API key required
  rf_rate_series: "TB3MS"
  rf_rate_url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=TB3MS"

# SUPERSEDED — these build-level stubs are no longer read by any code. Both
# corrections are now VIEW-level RunConfig toggles (agents/quant/library):
#   apply_stale_price_filter      → panel_view.stale_mask (A3)
#   apply_survivorship_correction → panel_view.include_terminal_rows (FISD
#                                   exit_reason; live since the 2026-06-14 merge)
# Kept here only as a pointer; safe to delete once nothing references the name.
monthly_panel_corrections:
  apply_stale_price_filter: false
  apply_survivorship_correction: false

# Signal-prep constants. Each signal is computed from the monthly panel by
# a dedicated scripts/build_<signal>.py and emitted to
# data/development/signals/<signal>.parquet keyed on (cusip, date) for
# merge-at-feed-time consumption by the engine.
signals:
  # BBW (2019) 5% VaR proxy: per-bond rolling-window n-th lowest monthly
  # return × multiplier. With window=36 and rank=2: 5% × 36 = 1.8 → rank 2,
  # which is the convention BBW use.
  var_5pct:
    window: 36          # trailing-36-month window (BBW 2019)
    min_obs: 24         # minimum non-NaN observations to compute (BBW 2019)
    rank: 2             # 2nd-lowest sorted return (BBW 2019)
    multiplier: -1.0    # higher var_5pct = more downside risk

  # A3 (registry amendments v1.1) — stale-price mask threshold.
  # mask price_eom_corr(i,t) iff month_end(t) − last_trade_date_corr(i,t) > θ
  # calendar days (strict >). Propagation: a masked p(t) invalidates both
  # ret(t) and ret(t+1) under the masked view (A3.2).
  # θ default 30; final value will come from the 01_trace_explore gap
  # distribution per A3.3 (closes O2). θ is chosen from coverage statistics
  # only — never from factor performance.
  stale_price:
    theta_days: 30
    source: "registry amendments v1.1 A3.3 (default); final value from 01_trace_explore"

# PyBondLab post-aggregation filters.
# These apply to the monthly return PANEL, not raw TRACE transactions.
# Applied by the Quant agent's return-aggregation step, not by preprocess_trace.py.
pybondlab_filters:
  # Dickerson, Robotti, Rossetti (2025) / PyBondLab defaults
  price_filter_threshold: 25.0
  # WRDS-MMN (2025) bounce-back filter — verify exact value against Table A1 before first Quant run
  bounce_filter_threshold: -0.25
  # To be confirmed before first Quant run
  trim_upper_bound: 0.40
  winsorise_percentile: 99.5

# DRR (Dickerson, Robotti, Rossetti 2026) bounce-back filter, Table A.2.
# Applied by scripts/bounce_back_filter.py as a post-processing step after
# preprocess_trace.py. Input and output are both trace_clean.parquet.
# Provenance and explicit divergences are documented in
# docs/bounce_back_filter_spec.md §0.
bounce_back_filter:
  # Core spike detection (DRR Table A.2)
  threshold_abs: 35.0        # Flag a trade if |price - anchor| exceeds this (price points)
  lookahead: 5               # Number of subsequent trades to check for price recovery
  window: 5                  # Number of unique prices in rolling trailing median
  back_to_anchor_tol: 0.25   # A future price is a "recovery" if within this of anchor
  candidate_slack_abs: 1.0   # Added to back_to_anchor_tol for recovery detection

  # Cooldown after a par-block flag (DRR Table A.2, clause iii).
  # Applied ONLY when the dropped trade was flagged via par-snap (its trailing
  # window was a par-block) — matching the DRR description "rows skipped after
  # flagging par blocks". Non-par drops do not trigger cooldown.
  par_cooldown_after_flag: 2

  # Par snap heuristic — for bonds trading near par, the FLAGGING anchor
  # snaps to par_level (preventing false positives from minor median drift
  # for at-par bonds). The RECOVERY check always uses the trailing median,
  # regardless of par-snap, because recovery asks "did the bond return to its
  # actual trading level" — that is the median by construction. Coupling the
  # two created a dead zone for bonds in [par-par_band, par+par_band] off par.
  # The anchor decoupling is an extension beyond DRR; see spec §0.
  par_spike_heuristic: true
  par_level: 100.0           # Par price
  par_band: 15.0             # |price - par_level| <= par_band triggers the heuristic
  par_min_run: 3             # Consecutive trades near par required to activate

# DRR (Dickerson, Robotti, Rossetti 2026) distressed daily filters 1-4.
# Source: DRR-2026 Appendix A.3 Table A.3, transcribed via the published
# description per A7.3 of the registry amendments (independent coding from
# the appendix; do NOT port `trace-data-pipeline` code — firewall).
# Applied by scripts/apply_distressed_filters.py on the corrected daily
# layer only (raw family bypasses entirely per A1.1).
meas_err_distressed_filters:
  # Filter 1 — anomaly (isolated ultra-low prints sitting ≥ ρ_anomaly price
  # points below the surrounding ±L-day median). Catches single-day price
  # collapses that don't reflect a market move.
  rho_anomaly: 3.0           # Threshold below ±L-day median (price points)
  L: 5                       # Half-window (days) for the median computation

  # Filter 2 — spike (prints ≥ ρ_spike price points above the pre-spike
  # median that recover to within ρ_recovery of median within L days).
  rho_spike: 3.0             # Threshold above pre-spike median (price points)
  rho_recovery: 2.0          # Recovery tolerance (price points to median)

  # Filter 3 — plateau (runs of ≥ ℓ_min identical ultra-low or round-number
  # prices with ≥ ρ_plateau pre/post displacement on either side).
  rho_plateau: 3.0           # Pre/post displacement threshold (price points)
  ell_min: 2                 # Minimum run length (days)
  tau_plateau: 0.15          # "Round-number" tolerance (price points) for
                             # plateau identification — a price within
                             # tau_plateau of a round multiple (e.g. 100,
                             # 50, 25) counts as round-numbered
  round_step: 25.0           # Grid of round-number plateau levels:
                             # multiples of 25 cover 25/50/75/100/125/...,
                             # the conventional bond plateaus. Moved here
                             # from a hard-coded _is_near_round default per
                             # the thresholds-in-yaml rule.

  # Filter 4 — intraday inconsistency (days where the day's mean is below
  # tau_intraday AND the intraday range (max - min) > gamma_range × mean).
  # Combines low-price-bond context with abnormal range to catch erratic
  # daily prints.
  tau_intraday: 20.0         # Low-price threshold (price points)
  gamma_range: 0.75          # Range/mean ratio threshold

  # Shared ultra-low price gate referenced by filters 1 and 3.
  tau_low: 0.10              # Ultra-low price gate (price points)
  tau_high: 5.0              # RESERVED — not consumed by any current filter
                             # (kept for DRR Table A.3 completeness; not in
                             # apply_distressed_filters REQUIRED_KEYS).
                             # Wiring an ultra-high gate would be a
                             # methodology change requiring its own review.

# FISD reference preprocessing (scripts/build_fisd_reference.py).
# Source: WRDS Mergent FISD reference tables (data/fisd/*). This block governs
# the FISD-restricted universe definition, the rating letter→numeric ladder,
# and the as-of monthly rating construction. It is a PREPROCESSING-only step:
# it does NOT touch the monthly panel or the merge — those land in Phase 1.
# [VERIFY] the universe rules against Dickerson-Robotti-Rossetti "Common
# pitfalls" appendix / trace-data-pipeline before the Phase 1 merge is wired.
fisd:
  universe:
    # Currency: FISD leaves domestic-USD currency blank (~100% null on the
    # matched set), so null is treated as USD and allowed.
    currency_allow: ["USD"]
    allow_null_currency: true
    exclude_convertible: true     # convertible == 'Y' dropped
    exclude_asset_backed: true    # asset_backed == 'Y' dropped (structured/ABS)
    exclude_144a: true            # rule_144a == 'Y' dropped (DRR convention — VERIFY)
    exclude_perpetual: true       # perpetual == 'Y' dropped (no maturity → no TTM)
    # Coupon type: 'F' fixed, 'Z' zero-coupon kept; 'V' variable/floating dropped.
    # Keeping 'Z' is a flagged decision — confirm against DRR before the merge.
    coupon_type_allow: ["F", "Z"]
    # bond_type corporate keep-list. Excludes agency/government (USBN, FGOV),
    # preferred (PS, PSTK), and non-corporate codes by omission. VERIFY the
    # exact set against DRR; RNT/CCOV are borderline and flagged in the report.
    bond_type_keep: ["CDEB", "CMTN", "CMTZ", "CPAS", "CPIK", "UCID"]
  rating:
    # Agency codes in reference_fisd_ratings.rating_type: SPR=S&P, MR=Moody's,
    # FR=Fitch, DPR=DBRS.
    #
    # BBW/DRR convention (BBW_anchor_implementation_spec.md §2.3): the monthly
    # numeric rating is the AVERAGE of the agencies in `average_agencies` when
    # more than one is available, with single-agency fallback when only one is.
    # Fitch (FR) and DBRS (DPR) are excluded by omission — BBW averages S&P and
    # Moody's only. This deliberately MATCHES BBW (2019 §3.3.2) rather than the
    # rejected first-non-null priority pick (audit trail in spec §2.3).
    #
    # Notch alignment: the `sp` and `moody` ladders below coincide notch-for-notch
    # 1..21 (AAA/Aaa=1 … C/C=21); only S&P's D=22 has no Moody's equivalent, so a
    # split S&P-D / Moody's-C averages to 21.5. That single residual bottom-notch
    # mismatch is the CONFIRM-ON-READ item against DRR's exact reconciliation
    # (spec §11.1); everything above C is already aligned, so the build proceeds.
    average_agencies: ["SPR", "MR"]
    not_rated_tokens: ["NR"]              # NR → not-rated (null numeric)
    withdrawn_status: ["WOFF", "Off"]     # rating withdrawn → not-rated from that date
    date_min: "1980-01-01"               # rating_date hygiene: drop events before this
    ig_threshold: 10                      # numeric ≤ 10 (BBB-/Baa3) ⇒ investment grade
  rating_numeric_map:
    # Unified 1–22 ladder (AAA/Aaa=1 … D=22). S&P/Fitch share the 'sp' map;
    # Moody's uses 'moody'. Source: standard 22-notch rating ladder.
    sp:
      "AAA": 1
      "AA+": 2
      "AA": 3
      "AA-": 4
      "A+": 5
      "A": 6
      "A-": 7
      "BBB+": 8
      "BBB": 9
      "BBB-": 10
      "BB+": 11
      "BB": 12
      "BB-": 13
      "B+": 14
      "B": 15
      "B-": 16
      "CCC+": 17
      "CCC": 18
      "CCC-": 19
      "CC": 20
      "C": 21
      "D": 22
    moody:
      "Aaa": 1
      "Aa1": 2
      "Aa2": 3
      "Aa3": 4
      "A1": 5
      "A2": 6
      "A3": 7
      "Baa1": 8
      "Baa2": 9
      "Baa3": 10
      "Ba1": 11
      "Ba2": 12
      "Ba3": 13
      "B1": 14
      "B2": 15
      "B3": 16
      "Caa1": 17
      "Caa2": 18
      "Caa3": 19
      "Ca": 20
      "C": 21
  amount_outstanding:
    # amount_outstanding in mergedissue is unreliable (median 0, some negative);
    # offering_amt is the static issuance-size proxy until a time-varying
    # reconstruction from FISD action events is built. Final VW choice is
    # deferred to the Phase 1 merge — this step only surfaces the evidence.
    size_proxy: "offering_amt"
  duration:
    # Carried for the future term/duration signal; duration recompute (from
    # maturity + coupon, never FISD/OSBAP md_dur) lands with the BBW signals.
    day_count_default: "30/360"
  survivorship:
    # exit_reason inputs. exit_reason records the EARLIEST of default_date,
    # defeased_date, maturity (matured | defaulted | defeased) — the full audit
    # label. default_date is the first rating event in default_tokens (FISD has
    # no default-date field; the rating ladder's default bucket dates it).
    default_tokens: ["D", "SD", "DD", "DDD"]
    # The survivorship TOGGLE (views.py) acts ONLY on these exit_reason values:
    # distress rows are dropped in the naive run and kept in the corrected run —
    # their difference is the survivorship gap. Maturity / defeased are recorded
    # but NOT toggled: they are performance-neutral, anticipated exits, kept in
    # BOTH runs so they cancel and add nothing to the gap. (Calls are undateable
    # in FISD, so never flagged — a documented limitation.)
    distress_exits: ["defaulted"]
