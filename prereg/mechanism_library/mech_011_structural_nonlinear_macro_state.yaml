mechanism_id: mech_011
version: 1.0.0
title: Structural nonlinear dependence of return dynamics on macro state
claim: >
  Leading structural asset-pricing models imply that return dynamics — hence the compensation a
  signal earns — are nonlinear functions of macro state variables, so a signal's predictive
  strength can flip across the macro regime rather than merely scaling with it. This motivates a
  binary/regime macro conditioning distinct from a linear macro interaction.
