mechanism_id: mech_005
version: 1.0.0
title: Macro state forecasts downturns and low-return regimes
claim: >
  Macro conditioning information (credit spread, term spread, market variance) forecasts market
  downturns and low-return states, so a signal's payoff is state-dependent: it should be
  down-weighted in adverse macro regimes and up-weighted in benign ones.
sources:
  - source_id: DG_2025
    kind: primary
    quote: "macro information is able to predict market downturns and correspondingly low returns"
    verification:
      extractor: pymupdf
      text: "papers/pdf/Deep Learning for Corporate Bonds (DG).pdf"
      locate_level: L1
      page: 2
      cite: "Duraj & Giesecke (2025), 'Deep Learning for Corporate Bonds', Introduction, p.2"
    status: VERIFIED
applicability:
  strategy_families: [CHARACTERISTIC_SORT, IPCA]
  required_inputs:
    - {variable_family: macro_regime_indicator, timing_rule: observed_before_formation}
allowed_templates: [lagged_binary_regime_interaction_v1, lagged_continuous_interaction_v1]
forbidden_uses:
  - threshold_selected_on_performance
  - contemporaneous_regime_data
  - look_ahead_regime_classification
