mechanism_id: mech_008
version: 1.0.0
title: Within-rating illiquidity premium
claim: >
  Holding credit rating fixed, a bond's own illiquidity (the gamma measure) governs its yield
  spread and expected return: within a rating bucket the more illiquid bond prices at a higher
  spread. A signal should therefore be conditioned on gamma_illiq — an ex-ante liquidity segment
  or a rating x illiquidity double-sort — because the illiquid segment carries the premium.
sources:
  - source_id: BPW_2011
    kind: primary
    quote: "the yield spread of this bond is on average 17 bps higher than the other"
    verification:
      extractor: pymupdf
      text: "papers/pdf/BPW.pdf"
      locate_level: L1
      page: 19
      cite: "Bao, Pan & Wang (2011), J. Finance 66(3), §III.B, p.930"
    status: VERIFIED
caveats:
  - >
    BPW's estimation window is April 2003 - June 2009, dominated by the single 2008 crisis. This
    CROSS-SECTIONAL within-rating premium is the least crisis-exposed BPW result: gamma's
    cross-sectional pricing remains economically and statistically significant using pre-2008
    data only. Record as robust off-crisis.
applicability:
  strategy_families: [CHARACTERISTIC_SORT]
  required_inputs:
    - {variable_family: liquidity_measure, timing_rule: observed_before_formation}
allowed_templates: [ex_ante_universe_conditioning_v1, signal_characteristic_interaction_v1]
forbidden_uses:
  - threshold_selected_on_performance
  - contemporaneous_conditioning_data
