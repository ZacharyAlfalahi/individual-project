mechanism_id: mech_004
version: 1.0.0
title: Macro-conditional (time-varying) risk premia
claim: >
  The risk premium earned per unit of factor exposure is not constant but a parametric function
  of observable macro state variables (e.g. the term spread); because compensation for risk moves
  with the macro regime, a return signal's predictive strength is conditional on that state.
sources:
  - source_id: GKX_2022
    kind: survey
    quote: "macro time series such as the term spread"
    verification:
      extractor: pymupdf
      text: "papers/pdf/Factor models, ML, and asset pricing.pdf"
      locate_level: L1
      page: 4
      cite: "Giglio, Kelly & Xiu (2022), Ann. Rev. Financial Economics 14, §2.2 Conditional Factor Models"
    chains_to:
      source_id: GOS_2016
      cite: "Gagliardini, Ossola & Scaillet (2016), Econometrica 84(3) (parametric time-varying risk premia; as suggested by Harvey & Ferson 1999)"
    status: VERIFIED
applicability:
  strategy_families: [CHARACTERISTIC_SORT, IPCA]
  required_inputs:
    - {variable_family: macro_regime_indicator, timing_rule: observed_before_formation}
allowed_templates: [lagged_binary_regime_interaction_v1, lagged_continuous_interaction_v1]
forbidden_uses:
  - threshold_selected_on_performance
  - contemporaneous_regime_data
  - look_ahead_regime_classification
