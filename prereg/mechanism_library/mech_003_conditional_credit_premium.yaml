mechanism_id: mech_003
version: 1.0.0
title: Conditional recovery of the credit risk premium
claim: >
  The credit risk premium is larger than static factor models estimate; conditioning on the
  credit-market regime, or restricting to a credit segment defined ex ante, recovers premium that
  unconditional sorts leave on the table.
sources:
  - source_id: KPP_2023
    kind: primary
    quote: >-
      the credit risk premium is notably larger than previously estimated.
    verification:
      extractor: frozen_canonical
      text: evaluation/canonical_texts/kpp_2023.frozen.yaml
      locate_level: L1
      page: 0
      cite: "Kelly, Palhares & Pruitt (2023), J. Finance 78(4), Abstract, p.1967"
    status: VERIFIED
applicability:
  strategy_families: [CHARACTERISTIC_SORT, IPCA]
  required_inputs:
    - {variable_family: credit_regime_indicator, timing_rule: observed_before_formation}
allowed_templates: [lagged_binary_regime_interaction_v1, ex_ante_universe_conditioning_v1]
forbidden_uses:
  - threshold_selected_on_performance
  - contemporaneous_regime_data
