    quote: 'Liquidity risk factor ( LRF ) is con- structed by independently sorting corporate bonds into 5 × 5 quintiles based on illiquidity and credit rating. LRF is the value-weighted aver- age return difference between the highest-illiquidity portfolio minus the lowest-illiquidity portfolio within each rating portfolio.'
