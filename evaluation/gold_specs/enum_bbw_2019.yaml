gold: true
paper_id: BBW_2019
constructions:
  - name: Downside Risk Factor (DRF)
    quote: 'downside risk factor (DRF)'
    class: strategy
  - name: CRF
    quote: 'These independent sorts also produce three credit risk factors so that the final credit risk factor (CRF) is defined as the average of the three factors of credit risk.'
