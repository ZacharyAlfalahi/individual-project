# Gold enumeration list -- Bektic (2018), T2 prospective paper (RQ2 coverage / D20).
# Bektic, D., "The low beta anomaly: A corporate bond investor's perspective",
# Review of Financial Economics 36(4) (2018) 300-306. T2-SEL-6 queue #6.
#
# Shape consumed by lister.load_gold_list: top-level `gold: true`, `paper_id`, and a
# `constructions` list of {name, quote, class, grid?}. The `authoring` block below is
# metadata (load_gold_list ignores unknown top-level keys) recording provenance.
#
# Scope notes (authoring rules applied; evaluation contract section 5.1 granularity):
#  * Strategy rows (1): the paper builds ONE construction -- monthly equal-weighted
#    quintile portfolios of European IG corporate bonds sorted on the issuer's 12-month
#    equity beta (section 2.2; Table 2 / Figure 1). The paper is explicitly LONG-ONLY
#    ("I focus on long-only portfolios ... shorting corporate bonds is hard in practice");
#    no Q1-minus-Q5 spread or factor is formed or reported anywhere, so the row is the
#    quintile sort itself, with Q1 (lowest beta) as the featured portfolio. A downstream
#    StrategySpec would have to record the long-only form; flagged for the StrategySpec
#    stage.
#  * Auxiliary rows (1): the equal-weighted market benchmark the paper itself forms from
#    the same universe ("Consequently, the benchmark is equal-weighted as well") and
#    reports as the "Market" column of Tables 2-3.
#  * NOT rows (documented exclusions): Table 3 (net-of-transaction-cost re-statement of
#    the same quintiles; BETC break-even costs) -- a robustness variant, not a new
#    construction; the beta signal itself (Eq. 1; a variable); alphas/betas/Sharpe
#    ratios (statistics); Chen-Lesmond-Wei bid-ask estimates (external inputs).
#  * Quote artifacts: the curly apostrophe in "firm's" is the text's own character,
#    copied verbatim (the L1 ladder unifies it at match time; do NOT "fix" it).
