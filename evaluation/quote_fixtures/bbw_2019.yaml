    category: body
    page_hint: 2
    text: "Although corporate bonds and stocks both reflect firm
fundamentals, they differ in several key features."
  - id: bbw19_q02
    category: body
    page_hint: 3
    text: "Thus, the idea of a disas-
ter exists and a risk averse, safety-first investor will seek to
reduce the chance of such a catastrophe occurring insofar
as possible."
  - id: bbw19_q03
    category: body
    page_hint: 4
    text: "Remove transaction records that are canceled and ad-
just records that are subsequently corrected or re-
versed."
  - id: bbw19_q04
    category: body
    page_hint: 7
    text: "We measure credit quality of corporate bonds via their
credit ratings that capture information on bond default
probability and the loss severity."
  - id: bbw19_q05
    category: number
    page_hint: 7
    text: "Our proxy
for downside risk, 5% VaR, is based on the lower tail of
the empirical return distribution, that is, the second low-
est monthly return observation over the past 36 months."
  - id: bbw19_q06
    category: number
    page_hint: 8
    text: "For each bond in our sample from July 2004 to Decem-
ber 2016, we compute the volatility, skewness, and kurto-
sis of monthly returns."
  - id: bbw19_q07
    category: number
    page_hint: 9
    text: "This result also indi-
cates that corporate bonds in the highest-VaR quintile gen-
erate 11.88% per annum higher return than bonds in the
lowest-VaR quintile."
  - id: bbw19_q08
    category: table
    page_hint: 9
    text: "Table reports the average VaR, the next-month average excess return, the five-factor alpha from stock market factors, the five-factor
alpha from bond market factors, and the ten-factor alpha for each quintile."
  - id: bbw19_q09
    category: table
    page_hint: 10
    text: "The last row shows the differences in alphas with respect
to the ten-factor model, which combines the five stock and five bond market factors."
  - id: bbw19_q10
    category: table
    page_hint: 11
    text: "Ratings are in conventional numerical scores, where 1 refers to
an AAA rating and 21 refers to a C rating."
  - id: bbw19_q11
    category: footnote
    page_hint: 12
    text: "These findings are also consistent with the univariate portfolio results
reported in Table A.2 of the online Internet Appendix."
