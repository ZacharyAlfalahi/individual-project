    page_hint: 2
    text: "Given that our sample
focuses exclusively on investment grade bonds, this magnitude of economic sig-
nificance is rather high."
  - id: bpw11_q02
    category: body
    page_hint: 3
    text: "In contrast, our paper
uses a direct measure of illiquidity to examine the pricing impact of illiquidity
in corporate bond spreads, both in aggregate and in the cross-section."
  - id: bpw11_q03
    category: body
    page_hint: 4
    text: "Finally, our paper also adds to the literature that examines the pricing impact
of illiquidity on corporate bond yield spreads."
  - id: bpw11_q04
    category: body
    page_hint: 7
    text: "To
calculate yield spreads for individual corporate bonds, we obtain Treasury bond
yields from the Federal Reserve, which publishes constant maturity Treasury
rates for a range of maturities."
  - id: bpw11_q05
    category: number
    page_hint: 7
    text: "For the whole sample in TRACE, the average monthly turnover is
3.71%, the average number of trades in a month is 33, and the median trade
size is $65,000."
  - id: bpw11_q06
    category: number
    page_hint: 2
    text: "This is especially true for AAA-rated bonds, whose
connection to credit risk becomes insignificant when 2008 and 2009 data are
included, whereas its connection to illiquidity increases significantly."
  - id: bpw11_q07
    category: number
    page_hint: 20
    text: " first column in Table VI shows that (controlling for calla-
bility), the average yield spread of the Aaa and Aa bonds in our sample is 129
bps, relative to which the A bonds are 61 bps higher and the Baa bonds are 176
bps higher."
