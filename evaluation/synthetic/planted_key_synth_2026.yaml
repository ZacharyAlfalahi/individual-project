  derivation_env: {python: 3.11.15, numpy: 2.4.4, pandas: 3.0.2}   # original derivation environment
  derivation_reverified: {python: 3.12.7, numpy: 2.4.4, pandas: 3.0.3, date: '2026-08-24', result: bit_exact_42_of_42}

dgp:
  generator: agents/auditor/data/synthetic_panel.py
  recipe:
    - 'spec = SyntheticSpec(seed=2026)'
    - 'panel, signals = make_clean_maximal_panel(spec)'
    - 'panel, signals = inject_survivorship(panel, signals, 0.30)'
    - 'signals = signals.rename(columns={"score_raw": "mom6_raw", "score_corr": "mom6_corr"})  # AFTER injection'
  params: {seed: 2026, n_bonds: 60, n_months: 72, alpha: 0.01, noise_sd: 0.015,
           start: '2005-01-31', rf_monthly: 0.001}
  injection:
    bias: survivorship
    function: inject_survivorship
    magnitude: 0.30
    target: top 30 percent of bonds by mean score (superset of the 12-bond long quintile)
    n_exits: 18
    exit_window: ['2008-01-31', '2009-06-30']
    crater_return: -0.30
    panel_rows_after_injection: 3843
  analytic_base_spread: 0.013248497147105942
  q_top_quintile_mean: 0.7009548800860327
  q_bottom_quintile_mean: -0.6238948346245614

seam_1_enumeration:
  driver_mode: gold           # enum_synth_2026.yaml; live-enum run optional/observational
  expected_constructions:
    - name: Synthetic Bond Momentum (SBM)
      class: strategy
      quote: 'We refer to this construction as Synthetic Bond Momentum (SBM).'
      page: 1

seam_2_extraction:
  expected_tag_counts: {part2_stated: 20, part2_unknown: 18, inferred: 0, design: 0}
  part1:
    formation_structure: {value: sorted_portfolios, tag: STATED, page: 1,
      quote: 'we sort bonds into quintile portfolios on a signal and trade the difference between the top and bottom portfolios'}
    asset_class: {value: corporate_bonds, tag: STATED, page: 1,
      quote: 'The data are a simulated panel of corporate bonds.'}
    method_summary:
      rubric: [monthly quintile sort, six-month momentum signal, long Q5 short Q1, equal weights, one-month hold]
      quotes_required: 1-3 locating
  sort_block:
    sort_signal:
      concept_id: past_6m_cumulative_return
      params: {}
      tag: STATED
      page: 2
      quote: "we rank bonds on six-month momentum, defined as the bond’s cumulative return over the six months ending at the formation month-end"
      note: registry v1 alias 'six-month momentum'; U+2019 apostrophe verbatim
    sort_kind: {value: single, tag: STATED, page: 2,
      quote: 'The sort is a single univariate sort; no second characteristic is used.'}
    n_groups: {value: 5, tag: STATED, page: 2,
      quote: 'we sort bonds into quintile portfolios (five groups) on this signal'}
    long_leg: {value: highest_signal, tag: STATED, page: 2,
      quote: 'The SBM factor is long the highest-momentum quintile (Q5) and short the lowest-momentum quintile (Q1).'}
    control_axis: null
    control_n_groups: {tag: UNKNOWN, reason: not_stated, note: vacuous - no control axis}
    bucketing_method: {tag: UNKNOWN, reason: not_stated, probe: true,
      note: "'quintile' names the buckets; equal-count vs breakpoint never stated; truth = engine equal_count default"}
    stripe_aggregation: {tag: UNKNOWN, reason: not_stated, note: vacuous - single sort}
    control_missing_policy: {tag: UNKNOWN, reason: not_stated, note: vacuous - no control axis}
    signal_transform: {tag: UNKNOWN, reason: not_stated, probe: true,
      note: "trap: the 'no winsorisation ... to returns' sentence is expost_trim, not a signal transform; truth = none"}
    combiner: {tag: UNKNOWN, reason: not_stated, routes_to_default: single_leg}
  common:
    signal_lag: {value: 0, tag: STATED, page: 2,
      quote: 'The signal is measured through the formation month-end, and we impose no reporting or implementation lag between signal measurement and portfolio formation.'}
    lag_convention: {value: month_end, tag: STATED, page: 2,
      quote: 'All observations and timing conventions are in month-end event time.'}
    weighting_scheme: {value: equal, tag: STATED, page: 2, quote: 'Portfolios are equal-weighted.'}
    strategy_side: {value: long_short, tag: STATED, page: 2,
      quote: 'The SBM factor is long the highest-momentum quintile (Q5) and short the lowest-momentum quintile (Q1).'}
    rebalance_frequency: {value: monthly, tag: STATED, page: 2,
      quote: 'Portfolios are re-formed at the end of every month and positions are held for one month.'}
    holding_period: {value: 1, tag: STATED, page: 2,
      quote: 'Portfolios are re-formed at the end of every month and positions are held for one month.'}
    return_label: {value: realisation, tag: STATED, page: 2,
      quote: 'The factor return attributed to month t+1 is the return realised over the month following formation.'}
    return_availability_policy: {value: require_next_month_return, tag: STATED, page: 1,
      quote: 'a bond enters the month-t sort only if it has a valid month-end observation in both month t and month t+1; bond-months failing this requirement are excluded for that month'}
    transaction_cost_convention: {value: gross, tag: STATED, page: 2,
      quote: 'All returns are gross of transaction costs.'}
    rf_convention: {value: subtract_rf, tag: STATED, page: 1,
      quote: 'Bond returns are measured in excess of the one-month Treasury bill rate.'}
    return_compounding: {value: arithmetic, tag: STATED, page: 1,
      quote: 'Returns are simple arithmetic monthly returns.'}
    significance_convention: {value: hac_t_of_mean, tag: STATED, page: 2,
      quote: 'The t-statistic uses Newey-West standard errors with three lags.'}
    hac_lags: {value: 3, tag: STATED, page: 2,
      quote: 'The t-statistic uses Newey-West standard errors with three lags.',
      note: engine auto rule floor(4*(71/100)^(2/9)) = 3 on both supports - stated value equals engine behaviour}
    annualisation: {value: arithmetic, tag: STATED, page: 2,
      quote: 'Annualised figures use arithmetic scaling: means are multiplied by twelve and Sharpe ratios by the square root of twelve.'}
    benchmark_model: {value: none, tag: STATED, page: 2,
      quote: 'We report raw factor premia; no factor-model adjustment is applied.'}
    expost_trim: {value: none, tag: STATED, page: 2,
      quote: 'We apply no winsorisation, truncation, or other ex-post adjustment to returns.',
      note: STATED none makes lab_trim runnable with OFF = none}
    eligibility_missing_policy: {tag: UNKNOWN, reason: not_stated, default: drop}
    min_bonds: {tag: UNKNOWN, reason: not_stated, default: groups, probe: true}
    min_bonds_granularity: {tag: UNKNOWN, reason: not_stated, default: total}
    tie_break_policy: {tag: UNKNOWN, reason: not_stated, default: deterministic_id, probe: true,
      note: engine truth is a DESIGN default, never paper-stated}
    weighting_base: {tag: UNKNOWN, reason: not_stated, probe: true,
      note: "trap: 'equal-weighted' makes the base vacuous; STATED par/market_value = hallucination"}
    weight_timing: {tag: UNKNOWN, reason: not_stated, default: formation, note: vacuous at one-month hold}
    empty_leg_policy: {tag: UNKNOWN, reason: not_stated, default: skip, note: never fires on this panel}
    overlap_convention: {tag: UNKNOWN, reason: not_stated, note: vacuous - one-month hold}
    cohort_weighting: {tag: UNKNOWN, reason: not_stated, note: vacuous - no cohorts}
    burn_in_policy: {tag: UNKNOWN, reason: not_stated, default: keep}
    missing_return_policy: {tag: UNKNOWN, reason: not_stated, default: drop_and_renormalise,
      note: load-bearing part carried by the STATED availability rule}
    realisation_min_survivors: {tag: UNKNOWN, reason: not_stated, default: 0}
  paper_facts:
    sample_start: {value: 2005-02, tag: STATED, page: 2,
      quote: 'The factor series spans February 2005 to December 2010 (71 monthly observations).'}
    sample_end: {value: 2010-12, tag: STATED, page: 2,
      quote: 'The factor series spans February 2005 to December 2010 (71 monthly observations).'}
    claimed_headline_metric:
      value: {mean: 1.15, t_stat: 11.80, unit: pct_per_month}
      tag: STATED
      page: 2
      quote: 'the SBM factor earns an average return of 1.15% per month (t = 11.80)'
    universe_filter:
      truth: simulated panel of 60 corporate bonds, Jan 2005 - Dec 2010; valid month-end observation
        required in t and t+1; bond-months from the month of default onward excluded (the plant)
      quotes:
        - {page: 1, quote: 'The panel comprises 60 simulated corporate bonds observed at each month-end from January 2005 to December 2010'}
        - {page: 1, quote: 'bonds that enter default are removed from the sample from the month of default onward, so the panel contains no post-default observations, including the default-month return itself'}
      current_driver_expectation: NOT_ASKED   # run_librarian emits UNKNOWN 'not extracted'; set to STATED once the schema supports the prose field-type
    defaults_count_check: {page: 1, n_exits: 18,
      quote: 'Eighteen of the sixty bonds enter default during the sample period, all between January 2008 and June 2009'}

