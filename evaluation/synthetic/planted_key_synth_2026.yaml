  lattice_cells: 32
  common_support: {n_months: 70, first: '2005-03-31', last: '2010-12-31'}
  Y_two_valued:
    survivorship_off_cells: 0.011521322051782124
    survivorship_on_cells: 0.004406978016512072
    within_half_tolerance: 1.0e-12
  doe_first_order:               # ON-minus-OFF = corrected-minus-uncorrected (RQ3 sign convention)
    survivorship: {expected: -0.007114344035270049, sign: -1}
    meas_err: {expected: 0.0, tolerance: 1.0e-12, mechanism: bit-exact no-op (families identical)}
    stale_price: {expected: 0.0, tolerance: 1.0e-12, mechanism: no stale rows}
    lab_trim: {expected: 0.0, tolerance: 1.0e-12, mechanism: published trim none == ON state}
    lib_gap: {expected: 0.0, tolerance: 1.0e-12, mechanism: persistent score - lag-invariant ranks on common support}
  bootstrap:
    params: {n_replicates: 200, data_driven_block_months: 6, min_effective_blocks: 3, holding_period: 1}
