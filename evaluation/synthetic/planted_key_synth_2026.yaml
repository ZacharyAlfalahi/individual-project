  procedure: truth_by_construction   # panel authored first -> statistics derived from the audited engine -> prose written third
  reverification: every planted value re-derived in-repo and confirmed bit-exact before freezing (drift gate)
  freeze_discipline: key frozen and git-tagged (t4b-synthetic-kat-frozen) before any live pipeline run
  errata_rule: never edited after a live run; misses are reported; key defects go through a dated errata amendment

provenance:
  pdf_file: papers/synthetic/sbm_synth_2026.pdf
  pdf_sha256: 040b51c199fcda214fff53820e9a89b8e640e5942c4b25f8ca5b3d1c83d3e592
  pdf_rebuilt: '2026-08-24'   # de-branding recompile (title block + banner); body text unchanged
  canonical_text: evaluation/canonical_texts/synth_2026.frozen.yaml
  canonical_recipe_normalise_sha256: abe11ff63b76df2e46a775a70f1feb397d10fa59984bafd38d312b178b01a79e
