true_value: 'Each month t, bonds are ranked on their cumulative return over months
  t−6 to t−1 and sorted into deciles P1–P10. The strategy is long the winner decile
  P10 and short the loser decile P1, equally weighted within portfolios, with positions
  held over months t+1 to t+6 (one skip month), so the strategy month-t return equally
  averages the six overlapping cohorts alive that month. The output is a monthly long-short
  momentum return series, January 1973–June 2011. Locating quotes: (1) header strategy_quote,
  page 9; (2) "The momentum strategy is long the winner portfolio, P10, and short
  the loser portfolio, P1." page 9; (3) "The overall momentum strategy month-t return
  is the equally weighted average month-t return of strategies implemented in the
  prior month and strategies formed up to six months earlier." page 9'
